<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>StayClean Agenda</title>
<meta name="theme-color" content="#4AA3E3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="StayClean Agenda">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bleu:#4AA3E3; --bleu-dark:#3D96D6; --nuit:#0F2233; --ciel:#7EC4EF;
  --pale:#EAF5FC; --fond:#F4F9FD; --bordure:#DFEDF7; --gris:#5A6B7C;
  --ambre:#B45309; --ambre-bg:#FEF3C7; --rouge:#E14D4D; --rouge-bg:#FCE8E8;
  --vert:#0E9F6E; --vert-bg:#DEF7EC;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html{-webkit-text-size-adjust:100%}
html,body{background:var(--fond);color:var(--nuit);font-family:'Poppins',system-ui,-apple-system,sans-serif;min-height:100%}
body{padding-bottom:env(safe-area-inset-bottom);overflow-x:hidden}
button{font-family:inherit;border:0;background:none;cursor:pointer;color:inherit}
input,textarea,select{font-family:inherit;font-size:16px;border:1px solid var(--bordure);background:var(--fond);border-radius:12px;padding:9px;color:var(--nuit);outline:none;width:100%}
input:focus,textarea:focus,select:focus{box-shadow:0 0 0 2px var(--bleu)}
.tnum{font-variant-numeric:tabular-nums}
.card{background:#fff;border:1px solid var(--bordure);box-shadow:0 4px 14px rgba(74,163,227,.07)}
.grad{background:linear-gradient(92deg,var(--nuit) 10%,var(--bleu) 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
header{background:#fff;border-bottom:1px solid var(--bordure);padding:calc(env(safe-area-inset-top) + 20px) 20px 16px}
.logo-row{display:flex;align-items:center;gap:8px;justify-content:space-between}
.logo-row .lft{display:flex;align-items:center;gap:8px}
.logo-row h1{font-size:20px;font-weight:800;letter-spacing:-.02em}
.logo-row h1 .b{color:var(--bleu)}
.cloud{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px}
.cloud.on{background:var(--vert-bg);color:var(--vert)}
.cloud.off{background:#EDF2F7;color:var(--gris)}
.cloud.err{background:var(--ambre-bg);color:var(--ambre)}
.badge{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;background:var(--pale);color:var(--bleu-dark)}
.btn-main{display:block;width:100%;margin-top:16px;padding:14px;border-radius:999px;background:var(--bleu);color:#fff;font-weight:700;font-size:16px;box-shadow:0 8px 20px rgba(74,163,227,.35);text-align:center}
.btn-main:active{opacity:.8}
.btn-main:disabled{background:#BBDCF3;box-shadow:none}
nav{display:flex;gap:6px;padding:16px 16px 0}
nav button{flex:1;padding:10px 4px;border-radius:999px;font-size:13px;font-weight:700;background:#fff;border:1px solid var(--bordure)}
nav button.on{background:var(--bleu);color:#fff;border-color:var(--bleu)}
main{padding:16px 20px 100px}
.sub{font-size:12px;color:var(--gris);font-weight:500;margin-bottom:12px}
.sub b{color:var(--nuit)}
.wknav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.wknav .arrow{width:36px;height:36px;border-radius:999px;font-weight:700}
.wknav .lbl{font-size:14px;font-weight:700}
.wknav .lbl span{color:var(--bleu);font-size:12px;font-weight:600;text-decoration:underline;margin-left:8px}
.day{border-radius:16px;padding:12px 16px;margin-bottom:10px}
.day.today{border-left:3px solid var(--bleu)}
.day.pastempty{opacity:.55}
.day-head{display:flex;align-items:center;justify-content:space-between}
.day-head .t{font-weight:700;font-size:14px}
.day-head .t small{color:var(--bleu);font-weight:700;font-size:12px;margin-left:6px}
.dots{display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:999px;border:2px solid #C9DFF0}
.dot.on{background:var(--bleu);border-color:var(--bleu)}
.full{background:var(--nuit);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:4px}
.rdv{display:block;width:100%;text-align:left;margin-top:8px;background:var(--fond);border:1px solid var(--bordure);border-radius:12px;padding:10px 12px;overflow:hidden}
.rdv:active{opacity:.7}
.rdv .l1{display:flex;justify-content:space-between;font-weight:700;font-size:14px}
.rdv .cl{display:block;font-size:14px;font-weight:500;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rdv .pr{display:block;font-size:12px;color:var(--gris);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.tag.done{background:var(--pale);color:var(--bleu-dark)}
.tag.todo{background:var(--ambre-bg);color:var(--ambre)}
.tag.fac{background:#EDF2F7;color:var(--gris);font-weight:500}
.libre{font-size:12px;color:#9FB6C8;margin-top:6px}
.annnote{font-size:12px;color:var(--gris);margin-top:8px}
.hero{border-radius:22px;padding:20px}
.hero .k{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--gris)}
.hero .v{font-size:42px;font-weight:800;line-height:1.1;margin-top:4px}
.hero .s{font-size:12px;color:var(--gris);font-weight:500;margin-top:8px}
.row2{display:flex;gap:10px;margin-top:10px}
.mini{flex:1;border-radius:16px;padding:14px 16px}
.mini .k{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--gris)}
.mini .v{font-size:20px;font-weight:800;margin-top:4px}
.mini .s{font-size:12px;color:var(--gris)}
.sec{border-radius:16px;padding:16px;margin-top:10px}
.sec .k{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--gris);margin-bottom:12px}
.bars{display:flex;align-items:flex-end;gap:6px;height:96px}
.bar{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px}
.bar i{display:block;width:100%;border-radius:4px 4px 0 0;background:#CFE5F5}
.bar.cur i{background:var(--bleu)}
.bar span{font-size:9px;color:var(--gris)}
.rep{margin-bottom:10px}
.rep .l{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;gap:8px}
.rep .l span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rep .l b{font-weight:700;flex-shrink:0}
.rep .g{height:6px;border-radius:999px;background:var(--pale)}
.rep .g i{display:block;height:6px;border-radius:999px;background:var(--bleu)}
.annrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bordure)}
.annrow .inf{flex:1;min-width:0}
.annrow .inf p{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.annrow .inf small{font-size:12px;color:var(--gris)}
.annrow .m{font-size:14px;font-weight:700;color:var(--rouge);flex-shrink:0}
.annrow .rest{font-size:12px;font-weight:700;background:var(--pale);color:var(--bleu-dark);padding:6px 10px;border-radius:999px;flex-shrink:0}
.annrow .del{color:var(--rouge);font-size:18px;padding:0 4px;flex-shrink:0}
.dayrow{display:flex;align-items:center;justify-content:space-between;width:100%;padding:9px 0;border-top:1px solid var(--bordure);font-size:13px;text-align:left}
.dayrow small{color:var(--gris);font-weight:400}
.dayrow b{font-weight:800}
.dayrow:active{opacity:.6}
.bars.tight{gap:1px}
.bars.tight .bar span{font-size:8px;min-height:10px}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;gap:12px}
.set-row span{font-size:14px}
.set-row input,.set-row select{width:auto}
.set-row input[type=number]{width:72px;text-align:center;font-weight:700}
.dur-row{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.dur-row input.lab{flex:1;min-width:0}
.dur-row input.kw{width:76px;font-size:13px;color:var(--gris)}
.dur-row input.mn{width:60px;text-align:center}
.dur-row .del{color:var(--rouge);font-size:18px;padding:0 4px}
.price-row{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.price-row .lab{flex:1;min-width:0;font-size:13px}
.price-row input{width:64px;text-align:center}
.addline{color:var(--bleu);font-size:14px;font-weight:700;margin-top:4px}
.note{font-size:12px;color:var(--gris);margin:4px 0 12px}
.setbtns{display:flex;gap:8px;margin-top:8px}
.setbtns button{flex:1;padding:10px;border-radius:999px;font-size:13px;font-weight:700;background:var(--pale);color:var(--bleu-dark)}
.overlay{position:fixed;inset:0;background:rgba(15,34,51,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.overlay{align-items:center}}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
@media(min-width:640px){.sheet{border-radius:24px}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sheet-head h2{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.sheet-head .x{font-size:24px;color:var(--gris);padding:0 8px;line-height:1}
.hint{font-size:12px;color:var(--gris);margin-bottom:12px}
textarea{resize:none;border-radius:16px;padding:12px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.thumb{position:relative}
.thumb img{width:64px;height:64px;object-fit:cover;border-radius:12px;border:1px solid var(--bordure);display:block}
.thumb .rm{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:999px;background:var(--rouge);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.thumb .n{position:absolute;bottom:2px;left:2px;background:rgba(15,34,51,.65);color:#fff;font-size:9px;font-weight:700;padding:0 4px;border-radius:4px}
.addimg{width:64px;height:64px;border-radius:12px;background:var(--pale);color:var(--bleu-dark);border:1.5px dashed var(--bleu);font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px}
.addimg small{font-size:8px;font-weight:600;line-height:1;margin-top:2px}
.imgcount{font-size:12px;color:var(--gris);margin-top:8px}
.busy{font-size:12px;color:var(--gris);text-align:center;margin-top:8px}
.linkline{display:block;text-align:center;font-size:13px;font-weight:700;color:var(--bleu);margin-top:12px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:11px;font-weight:700;color:var(--gris);margin-bottom:4px}
.fld input.warn{border:1.5px solid var(--ambre)}
.two{display:flex;gap:8px}
.two>div{flex:1}
.two>div.small{flex:0 0 118px}
.rem{font-size:12px;background:var(--ambre-bg);color:var(--ambre);padding:8px 12px;border-radius:12px;margin-bottom:12px}
.acts{display:flex;gap:8px;margin-bottom:12px}
.acts a{flex:1;text-align:center;padding:10px;border-radius:999px;font-size:14px;font-weight:700;background:var(--pale);color:var(--bleu-dark);text-decoration:none}
.acts2{display:flex;gap:8px}
.acts2 button{flex:1;padding:12px;border-radius:999px;font-size:14px;font-weight:700}
.b-done{background:var(--bleu);color:#fff}
.b-open{background:var(--fond);border:1px solid var(--bordure)}
.b-cancel{background:var(--rouge-bg);color:var(--rouge)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:60;border-radius:16px;padding:14px 16px;box-shadow:0 10px 30px rgba(15,34,51,.3)}
.toast.ok{background:var(--nuit)}
.toast.err{background:var(--rouge)}
.toast p{color:#fff;font-size:14px;font-weight:700}
.toast p+p{color:#BFD9EE;font-size:12px;font-weight:500;margin-top:4px}
.toast.err p+p{color:#FBD9D9}
.warnbox{margin:12px 20px 0;background:var(--ambre-bg);color:var(--ambre);font-size:12px;font-weight:500;padding:10px 14px;border-radius:12px}
.logo-img{height:44px;width:auto;display:block}
.seg{display:flex;background:#E2EDF5;border-radius:999px;padding:3px;gap:2px;margin-bottom:12px}
.seg button{flex:1;padding:7px 4px;border-radius:999px;font-size:12px;font-weight:700;color:var(--gris);transition:all .15s}
.seg button.on{background:#fff;color:var(--nuit);box-shadow:0 2px 8px rgba(15,34,51,.10)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{border-radius:18px;padding:14px 16px}
.kpi .k{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gris)}
.kpi .v{font-size:23px;font-weight:800;margin-top:3px}
.kpi .s{font-size:11px;color:var(--gris);margin-top:2px}
.kpi.today{background:linear-gradient(135deg,#0F2233 0%,#25628F 100%);border:0;box-shadow:0 10px 24px rgba(15,34,51,.25)}
.kpi.today .k{color:#8FB4D4}.kpi.today .v{color:#fff}.kpi.today .s{color:#8FB4D4}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mhead{font-size:10px;font-weight:700;color:var(--gris);text-align:center;padding:2px 0 6px}
.mday{aspect-ratio:1;border-radius:11px;background:#fff;border:1px solid var(--bordure);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;font-weight:600;color:var(--nuit);padding:0}
.mday.out{opacity:.32;pointer-events:none}
.mday.tdy{border:2px solid var(--bleu)}
.mday.full{background:var(--nuit);color:#fff;border-color:var(--nuit)}
.mday .dts{display:flex;gap:2px;height:4px}
.mday .dts i{width:4px;height:4px;border-radius:99px;background:var(--bleu)}
.mday.full .dts i{background:#7EC4EF}
.mday .amt{font-size:8px;font-weight:700;color:var(--bleu-dark);line-height:1.2}
.mday.full .amt{color:#BFE0F5}
.dayhead{border-radius:18px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
.dayhead .l .t{font-size:17px;font-weight:800}
.dayhead .l .s{font-size:11px;color:var(--gris);margin-top:2px}
.bigrdv{display:block;width:100%;text-align:left;margin-top:10px;border-radius:16px;padding:14px 16px;background:#fff;border:1px solid var(--bordure);box-shadow:0 4px 14px rgba(74,163,227,.07)}
.bigrdv:active{opacity:.7}
.bigrdv .hr{display:flex;justify-content:space-between;align-items:baseline}
.bigrdv .hr .hh{font-size:15px;font-weight:800}
.bigrdv .hr .mt{font-size:16px;font-weight:800}
.bigrdv .cl{display:block;font-size:14px;font-weight:600;margin-top:4px}
.bigrdv .pr{display:block;font-size:12px;color:var(--gris);margin-top:2px}
.bigrdv .ad{display:block;font-size:12px;color:var(--gris);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hidden{display:none}
.art-row{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.art-row select{flex:1;min-width:0;font-size:14px;padding:8px}
.art-row .qty{display:flex;align-items:center;gap:4px;flex-shrink:0}
.art-row .qty button{width:30px;height:30px;border-radius:999px;background:var(--pale);color:var(--bleu-dark);font-weight:800;font-size:16px}
.art-row .qty b{min-width:20px;text-align:center;font-size:14px}
.art-row input.m2{width:64px;text-align:center;flex-shrink:0}
.art-row .del{color:var(--rouge);font-size:18px;padding:0 2px;flex-shrink:0}
.totline{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:6px 0}
.totline b{font-weight:800}
.totline .old{text-decoration:line-through;color:var(--gris);font-weight:500;margin-right:6px}
.totline .tnum{display:flex;align-items:center}
.totline input.qprix{width:88px;text-align:right;font-weight:800;font-size:15px;padding:6px 8px;border-radius:10px}
.totline input.qdur{width:118px;text-align:right;font-weight:800;font-size:13px;padding:6px 8px;border-radius:10px}
.qprix-tag{display:inline-block;font-size:10px;font-weight:700;color:var(--bleu-dark);background:var(--pale);border-radius:999px;padding:2px 7px;margin-left:6px}
.quote-pre{width:100%;min-height:280px;font-size:14px;line-height:1.45;border-radius:16px;padding:12px;background:var(--fond);border:1px solid var(--bordure)}
.qbtns{display:flex;gap:8px;margin-top:10px}
.qbtns button,.qbtns a{flex:1;text-align:center;padding:12px 4px;border-radius:999px;font-size:13px;font-weight:700;text-decoration:none}
.q-copy{background:var(--pale);color:var(--bleu-dark)}
.q-wa{background:#25D366;color:#fff}
.q-rdv{background:var(--nuit);color:#fff}
.pick2{display:flex;gap:8px;margin-top:10px}
.pick2 button{flex:1;padding:12px;border-radius:16px;font-size:13px;font-weight:700;border:1.5px solid var(--bordure);background:#fff}
.pick2 button.selq{border-color:var(--bleu);background:var(--pale);color:var(--bleu-dark)}
.login-card{max-width:420px;margin:40px auto;border-radius:22px;padding:24px}
.mini-analyse{border:1.5px dashed var(--bleu);border-radius:16px;padding:12px;margin-bottom:12px;background:var(--pale)}
.mini-analyse p.t{font-size:12px;font-weight:700;color:var(--bleu-dark);margin-bottom:8px}

/* ===== Aujourd'hui / tâches / création rapide ===== */
nav button{font-size:12px;padding:10px 2px}
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 18px);width:58px;height:58px;border-radius:999px;background:var(--nuit);color:#fff;font-size:30px;font-weight:600;line-height:1;box-shadow:0 10px 26px rgba(15,34,51,.35);z-index:40;display:flex;align-items:center;justify-content:center}
.fab:active{transform:scale(.94)}
.tdy-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px}
.tdy-head h2{font-size:20px;font-weight:800;letter-spacing:-.02em}
.tdy-head .n{font-size:12px;color:var(--gris);font-weight:600}
.searchbar{position:relative;margin:10px 0 4px}
.searchbar input{padding-left:36px;background:#fff;border-radius:999px}
.searchbar:before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.6}
.overload{display:flex;gap:8px;align-items:center;background:var(--ambre-bg);color:var(--ambre);font-size:12.5px;font-weight:600;border-radius:14px;padding:10px 14px;margin-top:10px}
.tsec{border-radius:16px;padding:14px 16px;margin-top:12px}
.tsec .k{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--gris);margin-bottom:8px}
.tsec .k .cnt{font-weight:700;color:var(--bleu-dark);background:var(--pale);border-radius:999px;padding:1px 8px;font-size:11px}
.tsec.late{border-left:3px solid var(--rouge)}
.tsec.prio{border-left:3px solid var(--nuit)}
.trow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 0;border-top:1px solid var(--bordure)}
.trow:first-of-type{border-top:0}
.trow:active{opacity:.65}
.trow .chk{width:24px;height:24px;border-radius:999px;border:2px solid #C9DFF0;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
.trow.done .chk{background:var(--vert);border-color:var(--vert)}
.trow .bd{flex:1;min-width:0}
.trow .ti{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow.done .ti{text-decoration:line-through;color:var(--gris);font-weight:500}

.msg.ai{background:#F3E8FF;color:#3B1D5E;border-bottom-left-radius:4px}
.msg.ai a{color:#6D28D9;font-weight:700}
.chatrow{display:flex;gap:8px;margin-top:10px}
.chatrow input{flex:1;border-radius:999px}
.chatrow button{width:46px;height:46px;border-radius:999px;background:#7C3AED;color:#fff;font-size:18px;flex-shrink:0}
.chatsug{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chatsug button{font-size:12px;font-weight:600;padding:7px 12px;border-radius:999px;background:#fff;border:1px solid #EBE3F8;color:#5B21B6}
.chataction{border:1.5px dashed #A855F7;background:#FAF5FF;border-radius:14px;padding:12px;margin-bottom:8px}
.chataction p{font-size:13px;font-weight:600;color:#5B21B6;margin-bottom:8px}
.chataction .go2{display:flex;gap:8px}
.chataction button{flex:1;padding:9px;border-radius:999px;font-size:12.5px;font-weight:700}
.chataction .ok{background:#7C3AED;color:#fff}
.chataction .no{background:#EDE9FE;color:#5B21B6}
</style>

    m.site._v = 3;
    if (m.site.delaiJours > 1) m.site.delaiJours = 1; /* ne pas refuser un client pour demain */
    if (m.site.jours.indexOf(7) === -1) m.site.jours.push(7);
    m.site._v = 4;
    if (m.site.heures && m.site.heures.length) {
      m.site.ouverture = m.site.heures[0];
      m.site.conseilles = m.site.heures.slice();
    }
    delete m.site.heures;
  }
  if (!m.pricing) m.pricing = JSON.parse(JSON.stringify(DEFAULT_PRICING));
  else {
    m.pricing = Object.assign(JSON.parse(JSON.stringify(DEFAULT_PRICING)), m.pricing);
    if (!m.pricing.items || !m.pricing.items.length) m.pricing.items = JSON.parse(JSON.stringify(DEFAULT_PRICING.items));
    if (!m.pricing.moquette || !m.pricing.moquette.length) m.pricing.moquette = JSON.parse(JSON.stringify(DEFAULT_PRICING.moquette));
  }
  return m;
}

/* ----------------------------- utils ------------------------------ */

function pad(n) { return String(n).padStart(2, "0"); }
function fmtDate(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function parseDateStr(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
function addDaysStr(s, n) { var d = parseDateStr(s); d.setDate(d.getDate() + n); return fmtDate(d); }
function startOfWeek(d) { var x = new Date(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); x.setHours(0, 0, 0, 0); return x; }
var JOURS = ["Lun", "Mar", "Mer", "Jeu", "Ven", "Sam", "Dim"];
var JOURS_FULL = ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi", "Dimanche"];
var MOIS = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
var MOIS_FULL = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août", "Septembre", "Octobre", "Novembre", "Décembre"];
function euro(n) { return (Math.round((n || 0) * 100) / 100).toLocaleString("fr-BE", { maximumFractionDigits: 0 }) + " €"; }
function norm(s) { return (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }
function toMin(h) { var p = (h || "09:00").split(":"); return (+p[0]) * 60 + (+p[1] || 0); }
function fromMin(m) { return pad(Math.floor(m / 60)) + ":" + pad(m % 60); }
function fmtH(min) {
  var h = Math.floor(min / 60), m = min % 60;
  if (h === 0) return m + "min";
  return h + "h" + (m ? pad(m) : "");
}
function uid() { return "bk_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function humanDate(s) { var d = parseDateStr(s); return JOURS[(d.getDay() + 6) % 7] + " " + d.getDate() + " " + MOIS[d.getMonth()]; }
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
/* Mise en forme légère des réponses de l'assistant (gras, listes, titres) —
   le texte est échappé AVANT, donc aucun HTML ne peut être injecté. */
function mdLite(s) {
  var t = esc(s);
  t = t.replace(/^#{1,4}\s*(.+)$/gm, "<b>$1</b>");
  t = t.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  t = t.replace(/^\s*[*•-]\s+/gm, "&nbsp;• ");
  t = t.replace(/\n/g, "<br>");
  return t;
}
function todayStr() { return fmtDate(new Date()); }
function P() { return DB.settings.pricing; }
function findItem(id) { return P().items.find(function (x) { return x.id === id; }); }

/* ------------------------- durée & placement ----------------------- */

function computeDuration(prestations, settings) {
  var total = 0;
  (prestations || []).forEach(function (p) {
    var n = norm(p.nom);
    var hit = settings.durations.find(function (r) { return r.kw && n.indexOf(norm(r.kw)) !== -1; });
    if (hit) total += hit.min * (p.qte || 1);
  });
  return total > 0 ? total : settings.defaultDuration;
}

function placeBooking(parsed, bookings, settings) {
  var tStr = todayStr();
  function activeOn(d) { return bookings.filter(function (b) { return b.statut !== "annule" && b.date === d; }); }
  var dur = computeDuration(parsed.prestations, settings);

  var date = parsed.date || addDaysStr(tStr, 1);
  if (date < tStr) date = tStr;
  var shiftedDay = false;

  var guardDays = 0;
  while (activeOn(date).length >= settings.maxPerDay && guardDays < 90) {
    date = addDaysStr(date, 1); shiftedDay = true; guardDays++;
  }

  function slotStart() {
    return parsed.heure || (parsed.creneau === "matin" ? settings.morningStart : settings.afternoonStart);
  }

  var heure = slotStart();
  var shiftedTime = false;
  var guard = 0;
  while (guard < 20) {
    var s = toMin(heure), e = s + dur;
    var clash = activeOn(date).find(function (b) {
      var bs = toMin(b.heure), be = bs + (b.durationMin || 120);
      return s < be + 30 && bs < e + 30;
    });
    if (!clash) break;
    heure = fromMin(toMin(clash.heure) + (clash.durationMin || 120) + 30);
    shiftedTime = true;
    if (toMin(heure) + dur > 19 * 60) {
      date = addDaysStr(date, 1); shiftedDay = true;
      var g2 = 0;
      while (activeOn(date).length >= settings.maxPerDay && g2 < 90) { date = addDaysStr(date, 1); g2++; }
      heure = slotStart(); shiftedTime = false;
    }
    guard++;
  }
  return { date: date, heure: heure, dur: dur, shiftedDay: shiftedDay, shiftedTime: shiftedTime, dateOrigine: parsed.date };
}

function caActif(bookings) {
  return bookings.filter(function (b) { return b.statut !== "annule"; })
    .reduce(function (s, b) { return s + (b.total || 0); }, 0);
}

function callIA(prompt, images) {
  images = images || [];
  if (DB.settings.provider === "anthropic") {
    var content = [];
    images.forEach(function (im) {
      content.push({ type: "image", source: { type: "base64", media_type: im.media, data: im.b64 } });
    });
    content.push({ type: "text", text: prompt });
    return fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": DB.settings.apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 2000, messages: [{ role: "user", content: content }] })
    }).then(function (r) {
      return r.json().then(function (data) {
        if (!r.ok) throw new Error((data && data.error && data.error.message) || ("Erreur " + r.status));
        return (data.content || []).filter(function (c) { return c.type === "text"; }).map(function (c) { return c.text; }).join("\n");
      });
    });
  }
  var parts = [];
  images.forEach(function (im) { parts.push({ inline_data: { mime_type: im.media, data: im.b64 } }); });
  parts.push({ text: prompt });
  var url = "https://generativelanguage.googleapis.com/v1beta/models/" + GEMINI_MODEL + ":generateContent?key=" + encodeURIComponent(DB.settings.geminiKey);
  return fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ contents: [{ parts: parts }], generationConfig: { maxOutputTokens: 8192, responseMimeType: "application/json", thinkingConfig: { thinkingBudget: 0 } } })
  }).then(function (r) {
    return r.json().then(function (data) {
      if (!r.ok) throw new Error((data && data.error && data.error.message) || ("Erreur " + r.status));
      return geminiText(data);
    });
  });
}

/* Extrait le texte d'une réponse Gemini en ignorant les blocs de "réflexion
   interne" ; erreur claire si le modèle n'a rien renvoyé. */
function geminiText(data) {
  var cand = data && data.candidates && data.candidates[0];
  var parts = (cand && cand.content && cand.content.parts) || [];
  var txt = parts.filter(function (p) { return !p.thought; }).map(function (p) { return p.text || ""; }).join("\n").trim();
  if (!txt) throw new Error("Réponse vide" + (cand && cand.finishReason ? " (" + cand.finishReason + ")" : ""));
  return txt;
}

function jsonFrom(raw) {
  var clean = raw.replace(/```json|```/g, "").trim();
  var a = clean.indexOf("{"), b = clean.lastIndexOf("}");
  if (a === -1 || b === -1) throw new Error("Réponse illisible");
  return JSON.parse(clean.slice(a, b + 1));
}

/* -------------------- images : resize + base64 --------------------- */

function resizeImage(file, maxDim) {
  maxDim = maxDim || 1400;
  return new Promise(function (resolve, reject) {
    var reader = new FileReader();
    reader.onload = function () {
      var el = new Image();
      el.onload = function () {
        var scale = Math.min(1, maxDim / Math.max(el.width, el.height));
        var w = Math.max(1, Math.round(el.width * scale));
        var h = Math.max(1, Math.round(el.height * scale));
        var canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(el, 0, 0, w, h);
        var url = canvas.toDataURL("image/jpeg", 0.82);
        resolve({ id: uid(), b64: url.split(",")[1], media: "image/jpeg", preview: url });
      };
      el.onerror = function () { reject(new Error("Image illisible")); };
      el.src = String(reader.result);
    };
    reader.onerror = function () { reject(new Error("Lecture impossible")); };
    reader.readAsDataURL(file);
  });
}

function imgListFor(target) {
  if (target === "quote") return ui.qImgs;
  if (target === "detail") return ui.dImgs;
  return ui.imgs;
}
function setImgListFor(target, arr) {
  if (target === "quote") ui.qImgs = arr;
  else if (target === "detail") ui.dImgs = arr;
  else ui.imgs = arr;
}

function addFiles(fileList, target) {
  var files = Array.prototype.slice.call(fileList || []).filter(function (f) { return /^image\//.test(f.type); });
  if (!files.length) return;
  var cur = imgListFor(target);
  var room = MAX_IMGS - cur.length;
  if (room <= 0) { toast("err", [MAX_IMGS + " captures maximum par analyse."]); return; }
  Promise.all(files.slice(0, room).map(function (f) { return resizeImage(f); })).then(function (resized) {
    setImgListFor(target, cur.concat(resized).slice(0, MAX_IMGS));
    if (target === "quote") renderMain(); else renderModals();
  }).catch(function () {
    toast("err", ["Une image n'a pas pu être lue. Réessaie avec une capture PNG ou JPEG."]);
  });
}

function buildBooking(parsed, placed) {
  var manquants = [];
  if (!parsed.client) manquants.push("client");
  if (!parsed.telephone) manquants.push("téléphone");
  if (!parsed.adresse) manquants.push("adresse");
  if (parsed.total == null) manquants.push("montant");
  if (!parsed.date) manquants.push("date");
  return {
    booking: {
      id: uid(),
      client: parsed.client || "À COMPLÉTER",
      telephone: parsed.telephone || "",
      adresse: parsed.adresse || "",
      date: placed.date,
      heure: placed.heure,
      durationMin: placed.dur,
      prestations: parsed.prestations || [],
      total: parsed.total == null ? 0 : parsed.total,
      facture: parsed.facture === true,
      remarques: parsed.remarques || "",
      statut: "confirme",
      incomplet: manquants,
      creeLe: todayStr()
    },
    manquants: manquants
  };
}

function commitReservations(list) {
  var avant = caActif(DB.bookings);
  var working = DB.bookings.slice();
  var created = [];
  list.forEach(function (parsed) {
    var placed = placeBooking(parsed, working, DB.settings);
    var made = buildBooking(parsed, placed);
    working.push(made.booking);
    created.push({ booking: made.booking, placed: placed, manquants: made.manquants });
  });
  DB.bookings = working;
  save();
  siteSync(); /* le site retire aussitôt les créneaux devenus occupés */
  var apres = caActif(DB.bookings);

  var lignes;
  if (created.length === 1) {
    var c = created[0];
    lignes = [humanDate(c.placed.date) + " à " + c.placed.heure + " — " + c.booking.client];
    lignes.push(euro(c.booking.total) + " · CA actif : " + euro(avant) + " → " + euro(apres));
    if (c.placed.shiftedDay && c.placed.dateOrigine)
      lignes.push("⚠ " + humanDate(c.placed.dateOrigine) + " complet (" + DB.settings.maxPerDay + " max) → décalé");
    else if (c.placed.shiftedTime) lignes.push("⚠ Créneau occupé → heure décalée");
    if (c.manquants.length) lignes.push("À compléter : " + c.manquants.join(", "));
  } else {
    lignes = [created.length + " RDV planifiés"];
    created.slice(0, 5).forEach(function (c) {
      lignes.push(humanDate(c.placed.date) + " " + c.placed.heure + " — " + c.booking.client + " (" + euro(c.booking.total) + ")" + (c.placed.shiftedDay ? " ⚠ décalé" : ""));
    });
    if (created.length > 5) lignes.push("… +" + (created.length - 5) + " autres");
    lignes.push("CA actif : " + euro(avant) + " → " + euro(apres));
    var inc = created.filter(function (c) { return c.manquants.length; });

/* ------------------------- calculateur devis ----------------------- */

function moquettePrix(m2) {
  m2 = Math.max(1, Math.round(m2 || 1));
  var pal = P().moquette.find(function (t) { return m2 <= t.max; }) || P().moquette[P().moquette.length - 1];
  return m2 * pal.prix;
}

function quoteTotals(draft) {
  var base = 0, prem = 0, durMin = 0;
  (draft.articles || []).forEach(function (a) {
    var it = findItem(a.item); if (!it) return;
    if (it.id === "moquette") {
      var pm = moquettePrix(a.surface_m2 || 10) * (a.quantite || 1);
      base += pm; prem += pm;
    } else {
      base += it.base * a.quantite;
      prem += it.prem * a.quantite;
    }
    durMin += computeDuration([{ nom: it.label, qte: a.quantite }], DB.settings) * 1;
  });
  var minApplied = false;
  if (base > 0 && base < P().minimum) { base = P().minimum; minApplied = true; }
  if (prem > 0 && prem < P().minimum) { prem = P().minimum; }
  return { base: base, prem: prem, durMin: durMin || DB.settings.defaultDuration, minApplied: minApplied };
}

function hasManualPrix(v) { return v !== null && v !== undefined && v !== ""; }

/* Prix affichés/envoyés : si un prix a été dicté manuellement (par toi ou détecté
   dans le message), il remplace le calcul automatique par le catalogue d'articles. */
function quoteResolvedTotals(draft) {
  var t = quoteTotals(draft);
  var manualBase = hasManualPrix(draft.prixBase);
  var manualPrem = hasManualPrix(draft.prixPremium);
  return {
    base: manualBase ? Number(draft.prixBase) : t.base,
    prem: manualPrem ? Number(draft.prixPremium) : t.prem,
    durMin: t.durMin,
    minApplied: t.minApplied && !manualBase,
    manualBase: manualBase,
    manualPrem: manualPrem
  };
}

/* Durée estimée affichée sur le devis, basée sur le montant (moyenne des
   deux formules) — modifiable à la main dans le calculateur. */
function quoteDurationLabel(t) {
  var p = (t.base + t.prem) / 2;
  if (p < 100) return "40 min à 1h";
  if (p < 150) return "1h à 1h30";
  if (p < 200) return "1h30 à 2h";
  if (p < 300) return "2h à 2h30";
  return "3h à 4h";
}

function quoteDurationResolved(draft, t) {
  return draft.dureeCustom || quoteDurationLabel(t);
}

/* ---- création intelligente : parse du texte libre (local, sans IA) ---- */

var QA_JOURS = ["lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi", "dimanche"];
var KW_PRO = ["client", "devis", "intervention", "facture", "relance", "stayclean", "canape", "canapé", "tapis", "matelas", "moquette", "chantier", "materiel", "matériel", "produit", "pub", "marketing", "site", "compta", "tva", "avis google"];
var KW_PERSO = ["medecin", "médecin", "docteur", "dentiste", "consultation", "banque", "commune", "mutuelle", "voiture perso", "controle technique", "contrôle technique", "famille", "maman", "papa", "courses", "sport", "coiffeur", "anniversaire", "mariage", "ecole", "école", "vol", "voyage"];

function parseQuickText(txt) {
  var r = { titre: txt.trim(), date: null, heure: null, type: null, dom: null };
  if (!r.titre) return r;
  var low = norm(txt);
  var today = new Date();
  function setDate(d) { r.date = fmtDate(d); }
  function stripWord(re) { r.titre = r.titre.replace(re, " ").replace(/\s{2,}/g, " ").trim(); }

  /* heure : "15h", "15h30", "15:30", "à 15h" */
  var mh = txt.match(/(?:\b[àa]\s+)?\b(\d{1,2})\s*[h:]\s*([0-5]\d)?\b/i);
  if (mh && +mh[1] <= 23) {
    r.heure = pad(+mh[1]) + ":" + (mh[2] || "00");
    stripWord(new RegExp("(?:\\b[àa]\\s+)?\\b" + mh[1] + "\\s*[h:]\\s*" + (mh[2] || "") + "\\b", "i"));
  }
  /* date relative */
  if (/apres[- ]demain/.test(low)) { var ad = new Date(today); ad.setDate(ad.getDate() + 2); setDate(ad); stripWord(/apr[eè]s[- ]demain/i); }
  else if (/\bdemain\b/.test(low)) { var dm = new Date(today); dm.setDate(dm.getDate() + 1); setDate(dm); stripWord(/\bdemain\b/i); }
  else if (/aujourd/.test(low)) { setDate(today); stripWord(/aujourd['’]?hui/i); }
  /* jour de semaine → prochaine occurrence */
  if (!r.date) {
    for (var i = 0; i < 7; i++) {
      if (new RegExp("\\b" + QA_JOURS[i] + "\\b").test(low)) {
        var target = new Date(today);
        var delta = (i - ((today.getDay() + 6) % 7) + 7) % 7;
        if (delta === 0) delta = 7;
        target.setDate(target.getDate() + delta);
        setDate(target);
        stripWord(new RegExp("\\b" + QA_JOURS[i] + "\\b", "i"));
        break;
      }
    }
  }
  /* date jj/mm ou jj/mm/aaaa */
  if (!r.date) {
    var md = txt.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/);
    if (md && +md[1] >= 1 && +md[1] <= 31 && +md[2] >= 1 && +md[2] <= 12) {
      var y = md[3] ? (+md[3] < 100 ? 2000 + +md[3] : +md[3]) : today.getFullYear();
      var cand = new Date(y, +md[2] - 1, +md[1]);
      if (!md[3] && cand < today) cand.setFullYear(cand.getFullYear() + 1);
      setDate(cand);
      stripWord(new RegExp("\\b" + md[0].replace(/\//g, "\\/") + "\\b"));
    }
  }
  /* type */
  if (/\b(rdv|rendez[- ]vous|consultation|reunion|réunion)\b/.test(low) || (r.heure && /\b(medecin|médecin|docteur|dentiste|banque|commune)\b/.test(low))) r.type = "rdv";
  else if (/\b(penser|rappel|oublier|acheter)\b/.test(low)) r.type = "rappel";
  else if (/^(appeler|rappeler|envoyer|faire|preparer|préparer|relancer|payer|repondre|répondre)/.test(low)) r.type = "tache";
  /* domaine */
  var isPro = KW_PRO.some(function (k) { return low.indexOf(norm(k)) !== -1; });
  var isPerso = KW_PERSO.some(function (k) { return low.indexOf(norm(k)) !== -1; });
  if (isPerso && !isPro) r.dom = "perso";
  else if (isPro) r.dom = "pro";
  /* nettoyage du titre */
  r.titre = r.titre.replace(/\s+[àa]\s*$/i, "").trim();
  if (r.titre) r.titre = r.titre.charAt(0).toUpperCase() + r.titre.slice(1);
  return r;
}

    h += '<div class="statstrip">' +
      '<div class="st1"><b>' + nbRdvT + "</b><span>RDV aujourd’hui</span></div>" +
      '<div class="st1' + (nbDem ? " hot" : "") + '" data-act="tab" data-tab="demandes" style="cursor:pointer"><b>' + nbDem + "</b><span>Demande" + (nbDem > 1 ? "s" : "") + " du site</span></div>" +
      '<div class="st1"><b style="font-size:13px;line-height:2">' + (cgT ? "⛔ Bloqué" : (libT || "Complet")) + "</b><span>" + (cgT ? esc(cgT.motif) : "encore libre") + "</span></div>" +
      "</div>";
    var confT = conflitsJour(td);
    if (confT.length) h += '<div class="anomalie">⚠️ ' + confT.length + " RDV se chevauchent aujourd’hui — ouvre le Planning pour décaler.</div>";

    /* ma semaine en miniature — un clic ouvre la journée dans le Planning */
    h += '<div class="miniwk">';
    for (var mw = 0; mw < 7; mw++) {
      var dmw = addDaysStr(td, mw);
      var cgW = congeAt(dmw);
      var nW = DB.bookings.filter(function (b) { return b.date === dmw && b.statut !== "annule"; }).length;
      var dW = parseDateStr(dmw);
      var stW, clsW = "";
      if (cgW) { stW = '<span class="ms blk">⛔</span>'; clsW = " blkd"; }
      else if (nW) stW = '<span class="ms rv">' + nW + " RDV</span>";
      else stW = '<span class="ms ok">libre</span>';
      h += '<button class="' + (dmw === td ? "tdy" : "") + clsW + '" data-act="mini-day" data-d="' + dmw + '">' +
        '<span class="mj">' + JOURS[(dW.getDay() + 6) % 7] + '</span><span class="mn">' + dW.getDate() + "</span>" + stW + "</button>";
    }
    h += "</div>";
  }
  h += '<div class="searchbar"><input id="srch" placeholder="' + (f === "perso" ? "Rechercher tâche, RDV…" : "Rechercher client, tâche, RDV…") + '" value="' + esc(ui.searchQ) + '"></div>';

  /* --- résultats de recherche : remplacent le dashboard --- */
  if (ui.searchQ.trim().length >= 2) {
    var res = searchAll(ui.searchQ.trim());
    h += '<div class="srchres">';
    if (!res.bks.length && !res.tds.length && (!res.dcs || !res.dcs.length)) h += '<p class="emptyline" style="margin-top:14px">Aucun résultat.</p>';
    if (res.bks.length) {
      h += '<p class="grp">Clients & interventions</p><section class="card tsec" style="margin-top:4px">';
      res.bks.forEach(function (b) { h += bkRowToday(b); });
      h += "</section>";
    }
    if (res.tds.length) {
      h += '<p class="grp">Tâches & rappels</p><section class="card tsec" style="margin-top:4px">';
      res.tds.forEach(function (t) { h += tdRow(t); });
      h += "</section>";
    }
    if (res.dcs && res.dcs.length) {
      h += '<p class="grp">Documents & dossiers</p><section class="card tsec" style="margin-top:4px">';
      res.dcs.forEach(function (d) { h += docRow(d); });
      h += "</section>";
    }
    h += "</div>";
    return h;
  }

  /* surcharge */
  var loadMin = dayLoadMin(td);
  if (loadMin > 540) h += '<div class="overload">⚠️ Journée très chargée — ' + fmtH(loadMin) + " de planifié.</div>";

  /* factures à surveiller (univers pro uniquement) */
  if (f === "pro") h += facAlertsHtml();

  /* documents à traiter (univers perso) */
  if (f === "perso") {
    var docsW = docsATraiter().filter(function (d) { var j = docDays(d); return j === null || j <= 10; }).slice(0, 4);
    if (docsW.length) {
      h += '<section class="card tsec late"><p class="k">📄 À traiter <span class="cnt">' + docsW.length + "</span></p>";
      docsW.forEach(function (d) { h += docRow(d); });
      h += "</section>";
    }
  }

  var bksToday = DB.bookings.filter(function (b) { return b.date === td && b.statut !== "annule"; })
    .sort(function (a, b) { return toMin(a.heure) - toMin(b.heure); });
  var tdsToday = todosOn(td);
  var late = todosLate();
  var lateBk = DB.bookings.filter(function (b) { return b.date < td && b.statut === "confirme"; });
  if (f !== "tout") {
    tdsToday = tdsToday.filter(function (t) { return (t.dom || "pro") === f; });
    late = late.filter(function (t) { return (t.dom || "pro") === f; });
    if (f === "perso") { bksToday = []; lateBk = []; }
  }

  /* PRIORITÉ : les 3 plus importantes (critiques d'abord, retard critique inclus) */
  var prioPool = late.concat(tdsToday).filter(function (t) { return (t.prio || 0) > 0; })
    .sort(function (a, b) { return (b.prio || 0) - (a.prio || 0); }).slice(0, 3);
  if (prioPool.length) {
    h += '<section class="card tsec prio"><p class="k">⭐ Priorités du jour</p>';
    prioPool.forEach(function (t) { h += tdRow(t); });
    h += "</section>";
  }

  /* EN RETARD */
  if (late.length || lateBk.length) {
    h += '<section class="card tsec late"><p class="k">En retard <span class="cnt">' + (late.length + lateBk.length) + "</span></p>";
    lateBk.slice(0, 3).forEach(function (b) { h += bkRowToday(b); });
    late.slice(0, 5).forEach(function (t) { h += tdRow(t); });
    h += "</section>";
  }

  /* STAYCLEAN aujourd'hui */
  if (f !== "perso") {
    var proTds = tdsToday.filter(function (t) { return (t.dom || "pro") === "pro" && (t.prio || 0) === 0; });
    var proPrio = tdsToday.filter(function (t) { return (t.dom || "pro") === "pro" && (t.prio || 0) > 0 && prioPool.indexOf(t) === -1; });
    h += '<section class="card tsec"><p class="k">🧼 StayClean</p>';
    if (!bksToday.length && !proTds.length && !proPrio.length) h += '<p class="emptyline">Rien de prévu aujourd’hui.</p>';
    bksToday.forEach(function (b) { h += bkRowToday(b); });
    proPrio.concat(proTds).forEach(function (t) { h += tdRow(t); });
    h += "</section>";
  }

  /* PERSONNEL aujourd'hui */
  if (f !== "pro") {
    var persoTds = tdsToday.filter(function (t) { return t.dom === "perso" && prioPool.indexOf(t) === -1; });
    h += '<section class="card tsec"><p class="k">🏠 Personnel</p>';
    if (!persoTds.length) h += '<p class="emptyline">Rien de prévu aujourd’hui.</p>';
    else if (f === "perso") {
      var matin = [], aprem = [], soir = [], sansH = [];
      persoTds.forEach(function (t) {
        if (!t.heure) { sansH.push(t); return; }
        var mn = toMin(t.heure);
        if (mn < 720) matin.push(t); else if (mn < 1080) aprem.push(t); else soir.push(t);
      });
      if (matin.length) { h += '<p class="periode">☀️ Ce matin</p>'; matin.forEach(function (t) { h += tdRow(t); }); }
      if (aprem.length) { h += '<p class="periode">🌤 Cet après-midi</p>'; aprem.forEach(function (t) { h += tdRow(t); }); }
      if (soir.length) { h += '<p class="periode">🌙 Ce soir</p>'; soir.forEach(function (t) { h += tdRow(t); }); }
      if (sansH.length) { h += '<p class="periode">📌 Dans la journée</p>'; sansH.forEach(function (t) { h += tdRow(t); }); }
    }
    else persoTds.forEach(function (t) { h += tdRow(t); });
    h += "</section>";
  }

  /* PROCHAINEMENT : demain + après-demain */
  var d1 = addDaysStr(td, 1), d2 = addDaysStr(td, 2);
  var nextBks = DB.bookings.filter(function (b) { return (b.date === d1 || b.date === d2) && b.statut !== "annule"; })
    .sort(function (a, b) { return a.date === b.date ? toMin(a.heure) - toMin(b.heure) : (a.date < b.date ? -1 : 1); });
  var nextTds = todosActive().filter(function (t) { return t.date === d1 || t.date === d2; });
  if (f !== "tout") {
    nextTds = nextTds.filter(function (t) { return (t.dom || "pro") === f; });
    if (f === "perso") nextBks = [];
  }
  if (nextBks.length || nextTds.length) {
    h += '<section class="card tsec"><p class="k">Prochainement</p>';
    nextBks.slice(0, 4).forEach(function (b) { h += bkRowToday(b); });
    nextTds.slice(0, 4).forEach(function (t) { h += tdRow(t); });
    h += "</section>";
  }

  /* À PLANIFIER */
  var unp = todosUnplanned();
  if (f !== "tout") unp = unp.filter(function (t) { return (t.dom || "pro") === f; });
  if (unp.length) {
    h += '<section class="card tsec"><p class="k">À planifier <span class="cnt">' + unp.length + "</span></p>";
    unp.slice(0, 5).forEach(function (t) { h += tdRow(t); });
    h += "</section>";
  }

  /* PROGRESSION */
  var doneToday = todosDoneOn(td).length + DB.bookings.filter(function (b) { return b.date === td && b.statut === "termine"; }).length;
  var totalToday = doneToday + tdsToday.length + bksToday.filter(function (b) { return b.statut !== "termine"; }).length;
  if (totalToday > 0) {
    var pct = Math.round(doneToday / totalToday * 100);
    h += '<section class="card tsec"><p class="k">Progression</p><div class="progline"><div class="g"><i style="width:' + pct + '%"></i></div><b class="tnum">' + doneToday + "/" + totalToday + "</b></div></section>";
  }
  return h;
}

function toggleTodo(id) {
  var t = findTd(id); if (!t) return;
  t.done = t.done ? null : todayStr();
  save(); renderMain();
}

function postponeTodo(id, mode) {
  var t = findTd(id); if (!t) return;
  if (mode === "demain") t.date = addDaysStr(todayStr(), 1);
  else if (mode === "plan") { t.date = null; t.heure = null; }
  t.reports = (t.reports || 0) + 1;
  save();
  if (t.reports >= 5) toast("err", ["Reportée " + t.reports + " fois — supprime-la, planifie-la vraiment, ou découpe-la en plus petit."]);
  else toast("ok", [mode === "demain" ? "Reportée à demain." : "Remise dans « À planifier »."]);
  ui.todoId = null;
  renderAll();
}

/* ==================== factures StayClean ==================== */

function findFac(id) { return (DB.factures || []).find(function (f) { return f.id === id; }); }
function uidFac() { return "fc_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

function facDays(f) {
  if (!f.echeance) return null;
  return Math.round((parseDateStr(f.echeance) - parseDateStr(todayStr())) / 864e5);
}

function facStatus(f) {
  if (f.statut === "payee") return { cls: "b-payee", ecls: "e-ok", label: "✓ Payée", detail: f.payeLe ? "le " + humanDate(f.payeLe) : "" };
  var d = facDays(f);
  if (d === null) return { cls: "b-prevoir", ecls: "e-prevoir", label: "Échéance ?", detail: "Ajoute la date limite de paiement" };
  if (d < 0) return { cls: "b-retard", ecls: "e-retard", label: "⚫ EN RETARD", detail: "Dépassée de " + (-d) + " jour" + (d < -1 ? "s" : "") };
  if (d === 0) return { cls: "b-urgent", ecls: "e-urgent", label: "🔴 AUJOURD’HUI", detail: "Dernier jour pour payer" };

var DOC_KINDS = { facture: "Facture", amende: "Amende", courrier: "Courrier", voyage: "Voyage", contrat: "Contrat", identite: "Identité", autre: "Document" };

function uidDoc() { return "dc_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function findDoc(id) { return (DB.docs || []).find(function (d) { return d.id === id; }); }
function docsActive() { return (DB.docs || []).filter(function (d) { return d.statut !== "archive"; }); }
function docsATraiter() {

    .sort(function (a, b) { return (docDate(a) || "9999") < (docDate(b) || "9999") ? -1 : 1; });
}

/* date qui compte pour un document : son échéance, sinon sa fin de validité */
function docDate(d) { return d.echeance || d.expire || null; }
function docDays(d) {
  var ref = docDate(d);
  if (!ref) return null;
  return Math.round((parseDateStr(ref) - parseDateStr(todayStr())) / 864e5);
}
function docStatus(d) {
  if (d.statut === "ok") return { cls: "b-payee", ecls: "e-ok", label: "✓ Traité", detail: "" };
  if (d.statut === "archive") return { cls: "b-payee", ecls: "e-ok", label: "Archivé", detail: "" };
  var j = docDays(d);
  if (j === null) return { cls: "b-ok", ecls: "e-ok", label: "Info", detail: "Pas d’échéance" };
  if (!d.echeance && d.expire) {
    if (j < 0) return { cls: "b-retard", ecls: "e-retard", label: "⚫ EXPIRÉ", detail: "Depuis " + (-j) + " jour" + (j < -1 ? "s" : "") };
    if (j <= 60) return { cls: "b-prevoir", ecls: "e-prevoir", label: "🟠 À RENOUVELER", detail: "Expire dans " + j + " jours" };
    return { cls: "b-ok", ecls: "e-ok", label: "🟢 Valide", detail: "Expire dans " + j + " jours" };
  }
  if (j < 0) return { cls: "b-retard", ecls: "e-retard", label: "⚫ EN RETARD", detail: "Dépassé de " + (-j) + " jour" + (j < -1 ? "s" : "") };
  if (j <= 3) return { cls: "b-urgent", ecls: "e-urgent", label: "🔴 URGENT", detail: j === 0 ? "C’est aujourd’hui" : "Dans " + j + " jour" + (j > 1 ? "s" : "") };
  if (j <= 10) return { cls: "b-prevoir", ecls: "e-prevoir", label: "🟠 BIENTÔT", detail: "Dans " + j + " jours" };
  return { cls: "b-ok", ecls: "e-ok", label: "🟢 OK", detail: "Dans " + j + " jours" };
}

/* -------- analyse IA universelle d'un document -------- */

function parseDocAI(imgs) {
  imgs = Array.isArray(imgs) ? imgs : [imgs];
  var prompt = "Tu es l'assistant personnel d'un particulier en Belgique. Analyse les " + imgs.length + " photo(s) de ce document (facture, amende, courrier administratif, contrat, abonnement, billet d'avion/train, réservation, convocation...). Plusieurs photos = plusieurs pages du MÊME document.\n" +
    "Date d'aujourd'hui : " + dateHeader() + ".\n" +
    "Réponds UNIQUEMENT avec un JSON valide et COMPACT :\n" +
    '{"kind":"facture"|"amende"|"courrier"|"voyage"|"contrat"|"identite"|"autre","titre":string,"organisme":string|null,"montant":number|null,"date_document":"YYYY-MM-DD"|null,"date_limite":"YYYY-MM-DD"|null,"date_expiration":"YYYY-MM-DD"|null,"delai_jours":number|null,"reference":string|null,"action":string|null,"risque":string|null,"lien_officiel":string|null,"dossier_suggere":string|null,"vols":[{"depart":string|null,"arrivee":string|null,"date":"YYYY-MM-DD"|null,"heure":"HH:MM"|null,"numero":string|null}]|null}\n' +
    "Règles :\n- titre = résumé très court (ex: \"Amende stationnement Bruxelles\", \"Vol Brussels → Marrakech\").\n- action = ce que la personne doit CONCRÈTEMENT faire (ex: \"Payer 58€ par virement au compte BE...\").\n- risque = ce qui arrive si rien n'est fait, en une phrase, seulement si le document l'indique.\n- date_limite UNIQUEMENT si écrite explicitement. delai_jours si une condition de délai est écrite sans date.\n- kind \"identite\" = carte d'identité, passeport, permis de conduire, titre de séjour, carte européenne d'assurance maladie.\n- date_expiration = date de fin de validité écrite sur le document (carte d'identité, passeport, permis, abonnement, assurance). UNIQUEMENT si elle est écrite.\n- lien_officiel : UNIQUEMENT un site officiel belge certain et pertinent (ex: amendesroutieres.be pour une perception immédiate), sinon null. N'invente jamais d'URL.\n- dossier_suggere : un mot simple (Voiture, Amendes, Logement, Assurance, Voyage, Banque, Commune, Identité...).\n- vols : uniquement pour un billet/une réservation de transport. Liste TOUS les trajets du billet : un aller-retour donne DEUX entrées (aller puis retour), une correspondance donne une entrée par segment. Sinon null.\n- Information absente ou illisible => null. N'invente RIEN.";
  return callIA(prompt, imgs).then(jsonFrom);
}

function docFromParsed(p, imgPreview) {
  var echeance = null, estimee = false;
  if (p.date_limite) echeance = p.date_limite;
  else if (p.delai_jours && p.date_document) { echeance = addDaysStr(p.date_document, Math.round(p.delai_jours)); estimee = true; }

  var vols = [];
  if (p.vols && p.vols.length) vols = p.vols.filter(function (v) { return v && v.date; });
  else if (p.vol && p.vol.date) vols = [p.vol];
  vols.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
  if (!echeance && vols.length) echeance = vols[0].date;
  return {
    id: uidDoc(),
    kind: DOC_KINDS[p.kind] ? p.kind : "autre",

    montant: p.montant != null ? Number(p.montant) : null,
    dateDoc: p.date_document || null,
    echeance: echeance,
    expire: p.date_expiration || null,
    estimee: estimee,
    ref: p.reference || "",
    action: p.action || "",
    risque: p.risque || "",
    lien: p.lien_officiel || "",
    dossier: p.dossier_suggere || "",

  };

/* ============ documents → agenda (remplissage automatique) ============
   Un document rangé dans Ma Vie crée les entrées d'agenda qui vont avec :
   le vol lui-même, le rappel de la veille, l'échéance à payer, l'expiration
   d'une carte d'identité… Rien n'est inventé : uniquement des dates lues sur
   le document (ou explicitement estimées, et alors signalées comme telles). */

function docVols(doc) {
  var v = [];
  if (doc.vols && doc.vols.length) v = doc.vols;
  else if (doc.vol) v = [doc.vol];
  return v.filter(function (x) { return x && x.date; });
}

function docEvents(doc) {
  var out = [], td = todayStr();
  var nom = doc.titre || doc.organisme || "Document";
  var est = doc.estimee ? " (date estimée — vérifie)" : "";
  var vols = docVols(doc);

  vols.forEach(function (v, i) {
    var traj = (v.depart || "?") + " → " + (v.arrivee || "?");
    out.push({ key: "vol" + i, titre: "✈️ " + traj + (v.numero ? " · " + v.numero : ""), date: v.date, heure: v.heure || null, type: "rdv", prio: 2, label: "Le voyage lui-même, dans ton agenda" });
    var veille = addDaysStr(v.date, -1);
    if (veille >= td) out.push({ key: "prep" + i, titre: "🧳 Check-in en ligne + valises — " + traj, date: veille, heure: null, type: "rappel", prio: 1, label: "La veille : check-in et préparation" });
  });

  if (doc.expire) {
    out.push({ key: "exp", titre: "🪪 " + nom + " expire aujourd’hui", date: doc.expire, heure: null, type: "rappel", prio: 2, label: "Le jour de l’expiration" });
    var avant = addDaysStr(doc.expire, -60);
    if (avant >= td) out.push({ key: "expav", titre: "📋 Renouveler : " + nom + " (expire le " + humanDate(doc.expire) + ")", date: avant, heure: null, type: "rappel", prio: 1, label: "2 mois avant — le temps de prendre rendez-vous" });
  }

  /* échéance : ignorée pour un voyage, où la date du vol fait déjà foi */
  if (doc.echeance && !vols.length) {
    var money = doc.montant != null ? " · " + euro(doc.montant) : "";
    var verbe = (doc.kind === "amende" || doc.kind === "facture") ? "💸 Payer : "
      : doc.kind === "contrat" ? "📄 Échéance du contrat : " : "📌 À faire : ";
    out.push({ key: "main", titre: verbe + nom + money + est, date: doc.echeance, heure: null, type: "rappel", prio: 2, label: "Le jour de l’échéance" });
    var dAv = doc.kind === "contrat" ? 30 : 3;
    var pre = addDaysStr(doc.echeance, -dAv);
    if (pre >= td && pre !== doc.echeance) {
      out.push({ key: "pre", titre: (doc.kind === "contrat" ? "⏰ Contrat « " + nom + " » : résilier ou renégocier ?" : "⏰ Bientôt : " + nom + money), date: pre, heure: null, type: "rappel", prio: 1, label: dAv + " jours avant, pour ne pas être pris de court" });
    }
  }
  return out;
}

function docLinkedTodos(docId) {
  return (DB.todos || []).filter(function (t) { return t.docId === docId; });
}

/* Crée / met à jour / retire les entrées d'agenda d'un document.
   sel = objet {cle:true} des événements retenus ; absent = tous. */
function docSyncEvents(doc, sel) {
  DB.todos = DB.todos || [];
  var evs = docEvents(doc);
  var wanted = {};
  evs.forEach(function (e) { if (!sel || sel[e.key]) wanted[e.key] = e; });
  var n = 0;
  /* retire les entrées non retenues (jamais celles déjà cochées faites) */
  DB.todos = DB.todos.filter(function (t) {
    if (t.docId !== doc.id || t.done) return true;
    return !!wanted[t.evKey];
  });

    var e = wanted[k];
    var ex = (DB.todos || []).find(function (t) { return t.docId === doc.id && t.evKey === k; });
    if (ex) { /* la date du document a changé → l'agenda suit */
      if (!ex.done) { ex.titre = e.titre; ex.date = e.date; ex.heure = e.heure; }
      return;

    DB.todos.push({
      id: uidTd(), type: e.type, dom: "perso", titre: e.titre,
      date: e.date, heure: e.heure, prio: e.prio, done: null, reports: 0,
      creeLe: todayStr(), docId: doc.id, evKey: e.key
    });
    n++;
  });
  return n;
}

/* -------- rappel iPhone : fichier calendrier avec alarmes natives -------- */

function icsEscape(s) { return String(s || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n"); }

function downloadICS(titre, dateStr, heure, note) {
  var dt = dateStr.replace(/-/g, "");
  var lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//StayClean//MaVie//FR", "BEGIN:VEVENT"];
  lines.push("UID:" + Date.now() + "@stayclean-mavie");
  if (heure) {
    var hm = heure.replace(":", "");
    lines.push("DTSTART:" + dt + "T" + hm + "00");
  } else {
    lines.push("DTSTART;VALUE=DATE:" + dt);
  }
  lines.push("SUMMARY:" + icsEscape("🔔 " + titre));
  if (note) lines.push("DESCRIPTION:" + icsEscape(note));
  [["-P7D", "Dans 7 jours"], ["-P3D", "Dans 3 jours"], ["-PT9H", "Aujourd’hui"]].forEach(function (al) {
    lines.push("BEGIN:VALARM", "ACTION:DISPLAY", "TRIGGER:" + al[0], "DESCRIPTION:" + icsEscape(titre + " — " + al[1]), "END:VALARM");
  });
  lines.push("END:VEVENT", "END:VCALENDAR");
  var blob = new Blob([lines.join("\r\n")], { type: "text/calendar" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "rappel.ics";
  document.body.appendChild(a); a.click(); a.remove();
  toast("ok", ["Rappel créé — ouvre le fichier et ajoute-le à ton Calendrier iPhone.", "Les alarmes (7j, 3j, jour J) sont incluses."]);
}

/* ==================== COMPTA : moteur ==================== */

var CAT_DEP = ["carburant", "voiture", "materiel", "produits", "telephone", "internet", "logiciel", "assurance", "publicite", "comptable", "bureau", "domicile", "deplacement", "repas", "formation", "banque", "autre"];
var CAT_LABEL = { carburant: "Carburant", voiture: "Voiture", materiel: "Matériel", produits: "Produits", telephone: "Téléphone", internet: "Internet", logiciel: "Logiciel", assurance: "Assurance", publicite: "Publicité", comptable: "Comptable", bureau: "Bureau", domicile: "Domicile", deplacement: "Déplacement", repas: "Repas", formation: "Formation", banque: "Frais bancaires", autre: "Autre" };
var NAT_LABEL = { pro: "Pro", perso: "Perso", mixte: "Mixte", averifier: "À vérifier" };

function cptData() {
  if (!DB.cpt) DB.cpt = { dep: [], ven: [], set: null };
  if (!DB.cpt.set) DB.cpt.set = { cotis: 20.5, impot: 15, tvaDefault: 21 };
  if (DB.cpt.set.marge == null) DB.cpt.set.marge = 500;
  if (DB.cpt.set.solde === undefined) { DB.cpt.set.solde = null; DB.cpt.set.soldeDate = null; }
  return DB.cpt;
}
function uidDep() { return "dp_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function uidVen() { return "vn_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function findDep(id) { return cptData().dep.find(function (d) { return d.id === id; }); }
function findVen(id) { return cptData().ven.find(function (v) { return v.id === id; }); }

function venNextNumero() {
  var y = new Date().getFullYear();
  var n = cptData().ven.filter(function (v) { return (v.numero || "").indexOf(y + "-") === 0; }).length + 1;
  return y + "-" + String(n).padStart(3, "0");
}

/* ids des interventions déjà transformées en facture client
   (leur montant est alors compté via la facture, JAMAIS deux fois) */
function venLinkedBkIds() {
  var m = {};
  cptData().ven.forEach(function (v) {
    if (v.statut === "annulee") return;
    var s = v.source || "";
    var i = s.indexOf("bk_");
    if (i !== -1) m[s.slice(i)] = true;
  });
  return m;
}

/* --- agrégats : le CA encaissé vient des interventions StayClean terminées --- */
function cptCA(monthKey) {
  var enc = 0, futur = 0, encTva = 0;
  var td = todayStr();
  var linked = venLinkedBkIds();
  var tx = cptData().set.tvaDefault || 21;
  DB.bookings.forEach(function (b) {
    if (b.statut === "annule") return;
    if (monthKey && (b.date || "").slice(0, 7) !== monthKey) return;
    if (b.statut === "termine") {
      if (linked[b.id]) return; /* déjà comptée via sa facture */
      enc += b.total || 0;
      encTva += (b.total || 0) * tx / (100 + tx);
    }
    else if (b.date >= td) futur += b.total || 0;
  });
  var fact = 0, factEnc = 0, aRecevoir = 0, tvaCollectee = 0;
  cptData().ven.forEach(function (v) {
    if (v.statut === "annulee" || v.statut === "brouillon") return;
    if (monthKey && (v.date || "").slice(0, 7) !== monthKey) return;
    fact += v.ttc || 0;
    factEnc += v.paye || 0;
    aRecevoir += Math.max(0, (v.ttc || 0) - (v.paye || 0));
    tvaCollectee += v.tvaMontant || 0;
  });
  return { encaisse: enc, encaisseTVA: encTva, aVenirResa: futur, facture: fact, factureEncaisse: factEnc, aRecevoir: aRecevoir, tvaCollectee: tvaCollectee };
}

/* Chaîne fiscale estimée d'un mois : encaissé TTC → TVA → HT → − frais pro
   → bénéfice → cotisations (% du bénéfice) → impôt (% du bénéfice restant).
   L'impôt et les cotisations se calculent sur le BÉNÉFICE, jamais sur le CA. */
function cptFisc(monthKey) {
  var st = cptData().set;
  var tx = st.tvaDefault || 21;
  var ca = cptCA(monthKey), dep = cptDepenses(monthKey);
  var encTTC = ca.encaisse + ca.factureEncaisse;
  var baseHT = encTTC / (1 + tx / 100);
  var fraisProHT = Math.max(0, dep.pro - dep.tvaDeductible);
  var benef = Math.max(0, baseHT - fraisProHT);
  var cotis = benef * (st.cotis || 0) / 100;
  var baseImp = Math.max(0, benef - cotis);
  var impot = baseImp * (st.impot || 0) / 100;
  return { encTTC: encTTC, tvaIncluse: encTTC - baseHT, baseHT: baseHT, fraisProHT: fraisProHT, benef: benef, cotis: cotis, baseImp: baseImp, impot: impot };
}

/* TVA d'un trimestre : collectée (factures émises + interventions encaissées
   non facturées, TVA extraite au taux paramétré) − déductible (achats pro) */
function cptTvaTrim(y, tq) {
  var r = trimRange(y, tq);
  var tx = cptData().set.tvaDefault || 21;
  var col = 0, colN = 0, ded = 0, dedN = 0, colResa = 0, resaN = 0;
  cptData().ven.forEach(function (v) {
    if (v.statut === "annulee" || v.statut === "brouillon") return;
    if ((v.date || "") >= r.s && (v.date || "") <= r.e) { col += v.tvaMontant || 0; colN++; }
  });
  var linked = venLinkedBkIds();
  DB.bookings.forEach(function (b) {
    if (b.statut !== "termine" || linked[b.id]) return;
    if ((b.date || "") >= r.s && (b.date || "") <= r.e) { colResa += (b.total || 0) * tx / (100 + tx); resaN++; }
  });
  cptData().dep.forEach(function (d) {
    if ((d.date || "") < r.s || (d.date || "") > r.e) return;
    if (d.nature === "pro") { ded += d.tvaMontant || 0; dedN++; }
    else if (d.nature === "mixte" && d.pctPro != null) { ded += (d.tvaMontant || 0) * d.pctPro / 100; dedN++; }
  });
  return { col: col, colN: colN, colResa: colResa, resaN: resaN, ded: ded, dedN: dedN, solde: col + colResa - ded, range: r };
}

function cptDepenses(monthKey) {
  var tot = 0, pro = 0, tvaDed = 0, n = 0;
  cptData().dep.forEach(function (d) {
    if (monthKey && (d.date || "").slice(0, 7) !== monthKey) return;
    n++;
    tot += d.ttc || 0;
    if (d.nature === "pro") { pro += d.ttc || 0; tvaDed += d.tvaMontant || 0; }
    else if (d.nature === "mixte" && d.pctPro != null) {
      pro += (d.ttc || 0) * d.pctPro / 100;
      tvaDed += (d.tvaMontant || 0) * d.pctPro / 100;
    }
  });
  return { total: tot, pro: pro, tvaDeductible: tvaDed, nb: n };
}

/* anomalies : doublons, pro sans justificatif, ventes en retard, incohérences */
function cptAnomalies() {
  var out = [];
  var seen = {};
  cptData().dep.forEach(function (d) {
    var k = norm(d.fournisseur) + "|" + d.ttc + "|" + d.date;
    if (seen[k]) out.push("Doublon possible : « " + (d.fournisseur || "?") + " " + euro(d.ttc || 0) + " » enregistrée deux fois le " + (d.date ? humanDate(d.date) : "?") + ".");
    seen[k] = true;
    if (d.nature === "pro" && !d.img) out.push("« " + (d.fournisseur || d.categorie) + " " + euro(d.ttc || 0) + " » est classée pro sans justificatif photo.");
    if (d.nature === "mixte" && d.pctPro != null && !d.justif) out.push("« " + (d.fournisseur || "?") + " » a un % pro (" + d.pctPro + "%) sans justification écrite.");
  });
  var td = todayStr();
  cptData().ven.forEach(function (v) {
    if (v.statut !== "payee" && v.statut !== "annulee" && v.statut !== "brouillon" && v.echeance && v.echeance < td) {
      out.push("Facture " + v.numero + " (" + esc(v.client || "?") + ", " + euro((v.ttc || 0) - (v.paye || 0)) + " restants) : échéance dépassée de " + Math.round((parseDateStr(td) - parseDateStr(v.echeance)) / 864e5) + " j.");
    }
    if (v.paye > v.ttc) out.push("Facture " + v.numero + " : encaissé (" + euro(v.paye) + ") supérieur au montant facturé (" + euro(v.ttc) + ").");
    /* facture créée à la main qui ressemble à une intervention déjà comptée */
    if (v.statut !== "annulee" && v.statut !== "brouillon" && (v.source || "").indexOf("bk_") === -1) {
      var twin = DB.bookings.find(function (b) { return b.statut === "termine" && b.date === v.date && Math.abs((b.total || 0) - (v.ttc || 0)) < 0.01; });
      if (twin) out.push("Facture " + v.numero + " (" + euro(v.ttc || 0) + ") ressemble à l’intervention « " + esc(twin.client || "?") + " » du " + humanDate(twin.date) + " : si c’est la même prestation, elle est comptée DEUX fois. Supprime la facture et utilise « Importer une intervention ».");
    }
  });
  return out.slice(0, 6);
}

function venStatutInfo(v) {
  var td = todayStr();
  if (v.statut === "payee") return { cls: "b-payee", label: "✓ Payée" };
  if (v.statut === "annulee") return { cls: "b-payee", label: "Annulée" };
  if (v.statut === "brouillon") return { cls: "b-ok", label: "Brouillon" };
  if (v.paye > 0) return { cls: "b-prevoir", label: "Partielle" };
  if (v.echeance && v.echeance < td) return { cls: "b-retard", label: "⚫ RETARD" };
  return { cls: "b-ok", label: "Envoyée" };
}

function renderVentes() {
  var ca = cptCA(null);
  var h = '<div class="sitgrid">' +
    '<div class="card sit"><p class="k">Facturé (total)</p><p class="v tnum">' + euro(ca.facture) + '</p></div>' +
    '<div class="card sit pos"><p class="k">Encaissé (factures)</p><p class="v tnum">' + euro(ca.factureEncaisse) + '</p></div>' +
    '<div class="card sit neg"><p class="k">À recevoir</p><p class="v tnum">' + euro(ca.aRecevoir) + '</p></div>' +
    '<div class="card sit"><p class="k">TVA collectée <span class="estbadge">calcul</span></p><p class="v tnum">' + euro(ca.tvaCollectee) + "</p></div></div>";
  h += '<button class="cptscan" data-act="ven-new">➕ Nouvelle facture client</button>';
  h += '<button class="linkline" data-act="ven-pick">importer une intervention StayClean →</button>';
  var vens = cptData().ven.slice().sort(function (a, b) { return (a.date || "") < (b.date || "") ? 1 : -1; });
  if (vens.length) {
    h += '<section class="card tsec"><p class="k">Factures émises <span class="cnt">' + vens.length + "</span></p>";

      h += '<button class="facrow" data-act="ven-open" data-id="' + v.id + '">' +
        '<span class="bd"><span class="fo">#' + esc(v.numero) + " · " + esc(v.client || "?") + '</span>' +
        '<span class="me">' + (v.date ? humanDate(v.date) : "") + (v.echeance ? " · éch. " + humanDate(v.echeance) : "") + "</span></span>" +
        '<span class="mo tnum">' + euro(v.ttc || 0) + "</span>" +
        '<span class="fbulle ' + st.cls + '">' + st.label + "</span></button>";
    });
    h += "</section>";
  } else {
    h += '<p class="libre" style="text-align:center;margin-top:24px;font-size:13px">Aucune facture émise. Le CA encaissé de tes interventions StayClean est visible dans Situation.</p>';
  }
  h += '<div class="disclaim">💡 Le CA de tes interventions StayClean (encaissé à la prestation) est suivi automatiquement dans <b>Situation</b>. Cette section gère les factures officielles que tu émets en plus.</div>';
  return h;
}

function trimestreOf(mk) { return Math.floor((+mk.slice(5, 7) - 1) / 3) + 1; }
function trimRange(y, t) {
  var m1 = (t - 1) * 3;
  return { s: y + "-" + pad(m1 + 1) + "-01", e: y + "-" + pad(m1 + 3) + "-" + pad(new Date(y, m1 + 3, 0).getDate()), label: "T" + t + " " + y };
}

function renderTVA() {
  var now = new Date();
  var q = ui.cptQ || { y: now.getFullYear(), t: trimestreOf(todayStr().slice(0, 7)) };
  ui.cptQ = q;
  var tv = cptTvaTrim(q.y, q.t);
  var r = tv.range, solde = tv.solde;
  var h = '<div class="wknav"><button class="card arrow" data-act="tva-nav" data-d="-1">‹</button>' +
    '<button class="lbl">' + r.label + "</button>" +
    '<button class="card arrow" data-act="tva-nav" data-d="1">›</button></div>';
  h += '<section class="card sec"><p class="k">TVA du trimestre <span class="estbadge">estimation</span></p>' +
    '<div class="tvaline"><span>TVA collectée — factures émises (' + tv.colN + ')</span><b class="tnum">' + euro(tv.col) + "</b></div>" +
    '<div class="tvaline"><span>TVA collectée — interventions encaissées non facturées (' + tv.resaN + ', extraite à ' + (cptData().set.tvaDefault || 21) + '%)</span><b class="tnum">' + euro(tv.colResa) + "</b></div>" +
    '<div class="tvaline"><span>TVA déductible potentielle (achats pro, ' + tv.dedN + ')</span><b class="tnum">−' + euro(tv.ded) + "</b></div>" +
    '<div class="tvaline" style="border-top:2px solid var(--bordure)"><span><b>Solde estimé à reverser</b></span><b class="tnum" style="color:' + (solde >= 0 ? "#047857" : "var(--rouge)") + '">' + euro(Math.abs(solde)) + (solde < 0 ? " en ta faveur" : "") + "</b></div>" +
    '<p class="note" style="margin-top:8px">Une intervention payée sans facture reste soumise à la TVA (journal des recettes) : elle est comptée ici au taux paramétré. Si tu l’importes en facture, elle n’est comptée qu’une seule fois.</p></section>';
  h += '<div class="disclaim">⚠️ <b>ESTIMATION</b> — ce solde dépend de l’exactitude et de l’exhaustivité de tes encodages, et des règles de déductibilité applicables à chaque dépense. Il ne remplace pas ta déclaration officielle ni l’avis d’un comptable.<br><br>📅 Les <b>dates limites de déclaration TVA</b> ne sont pas stockées dans l’app pour éviter toute information obsolète — vérifie-les sur le site du SPF Finances.</div>';
  h += '<button class="cptscan" data-act="chat-tva">🔎 Vérifier mes échéances TVA en ligne (assistant)</button>';
  return h;
}

/* Obligations à payer dans les 30 jours (dépenses compta + factures fournisseurs StayClean) */
function cptAPayer30() {
  var td = todayStr(), lim = addDaysStr(td, 30), tot = 0;
  cptData().dep.forEach(function (d) {
    if (d.statut !== "paye" && (!d.echeance || d.echeance <= lim)) tot += d.ttc || 0;
  });
  facturesUnpaid().forEach(function (f) {
    if (!f.echeance || f.echeance <= lim) tot += f.montantTTC || 0;
  });
  return tot;
}

/* Réserves estimées du moment (cotis + impôts sur le bénéfice du mois + TVA trimestre) */
function cptReserves() {
  var mk = todayStr().slice(0, 7);
  var f = cptFisc(mk);
  var tv = cptTvaTrim(new Date().getFullYear(), trimestreOf(mk));
  var resTVA = Math.max(0, tv.solde);
  return { cotis: f.cotis, impot: f.impot, tva: resTVA, total: f.cotis + f.impot + resTVA };
}

function renderSituation() {
  var mk = todayStr().slice(0, 7);
  var ca = cptCA(mk);
  var caAll = cptCA(null);
  var dep = cptDepenses(mk);
  var st2 = cptData().set;
  var now = new Date();
