      '<div class="tvaline"><span>− À payer sous 30 jours</span><b class="tnum">−' + euro(aPayer30) + "</b></div>" +
      '<div class="tvaline"><span>− Marge de sécurité</span><b class="tnum">−' + euro(st2.marge || 0) + "</b></div>" +
      '<div class="tvaline" style="border-top:2px solid var(--bordure)"><span><b>Tu peux prudemment utiliser</b></span><b class="tnum" style="font-size:20px;color:' + (dispo >= 0 ? "#047857" : "var(--rouge)") + '">' + euro(Math.max(0, dispo)) + "</b></div>" +
      (dispo < 0 ? '<div class="anomalie">🔴 Trésorerie insuffisante : il manque environ ' + euro(-dispo) + " pour couvrir réserves, paiements à venir et marge. Évite tout retrait et demande à ton assistant quoi prioriser.</div>" : "") +
      '<div class="two" style="margin-top:10px"><div class="fld"><label>Solde du compte StayClean (€)</label><input type="number" step="0.01" value="' + st2.solde + '" data-cpt="solde"></div>' +
      '<div class="fld"><label>Marge de sécurité (€)</label><input type="number" step="50" value="' + (st2.marge || 0) + '" data-cpt="marge"></div></div>' +
      '<button class="linkline" data-act="chat-dispo">💬 Demander : « combien puis-je me verser ? »</button></section>';
  } else {
    h += '<section class="card sec" style="border:2px dashed #059669"><p class="k">💶 Argent prudemment disponible</p>' +
      '<p class="note" style="margin-top:0">Indique le solde actuel de ton compte StayClean et je calcule ce que tu peux utiliser sans te mettre en difficulté (réserves fiscales, paiements à venir et marge déduits).</p>' +
      '<div class="two"><div class="fld"><label>Solde du compte StayClean (€)</label><input type="number" step="0.01" placeholder="Ex : 7500" data-cpt="solde"></div>' +
      '<div class="fld"><label>Marge de sécurité (€)</label><input type="number" step="50" value="' + (st2.marge || 500) + '" data-cpt="marge"></div></div></section>';
  }

  h += '<div class="sitgrid">' +
    '<div class="card sit pos"><p class="k">Encaissé ce mois</p><p class="v tnum">' + euro(ca.encaisse + ca.factureEncaisse) + '</p><p class="s2">interventions terminées + factures</p></div>' +
    '<div class="card sit neg"><p class="k">Dépenses ce mois</p><p class="v tnum">' + euro(dep.total) + '</p><p class="s2">dont pro : ' + euro(dep.pro) + '</p></div>' +
    '<div class="card sit"><p class="k">À recevoir</p><p class="v tnum">' + euro(caAll.aRecevoir) + '</p><p class="s2">factures clients impayées</p></div>' +
    '<div class="card sit"><p class="k">RDV à venir</p><p class="v tnum">' + euro(caAll.aVenirResa) + '</p><p class="s2">réservations confirmées</p></div></div>';

  /* cohérence facturé vs encaissé */
  if (caAll.facture > 0 && caAll.factureEncaisse + caAll.aRecevoir < caAll.facture - 0.01) {
    h += '<div class="anomalie">🔴 Incohérence : ' + euro(caAll.facture) + " facturés mais " + euro(caAll.factureEncaisse) + " encaissés + " + euro(caAll.aRecevoir) + " à recevoir ne correspondent pas. Vérifie les statuts de tes factures.</div>";
  }

  /* réserve estimée — calcul détaillé : TTC → HT → bénéfice → cotisations → impôt */
  var f = cptFisc(mk);
  var tvq = cptTvaTrim(now.getFullYear(), trimestreOf(mk));
  var resTVA = Math.max(0, tvq.solde);
  h += '<section class="card sec"><p class="k">💰 À mettre de côté <span class="estbadge">estimation</span></p>' +
    '<p class="k" style="margin-top:6px;font-size:12px">1 · Ton bénéfice estimé du mois</p>' +
    '<div class="tvaline"><span>Encaissé TTC ce mois</span><b class="tnum">' + euro(f.encTTC) + "</b></div>" +
    '<div class="tvaline"><span>− TVA incluse (' + (st2.tvaDefault || 21) + '%, elle ne t’appartient pas)</span><b class="tnum">−' + euro(f.tvaIncluse) + "</b></div>" +
    '<div class="tvaline"><span>− Frais pro du mois (hors TVA)</span><b class="tnum">−' + euro(f.fraisProHT) + "</b></div>" +
    '<div class="tvaline" style="border-top:2px solid var(--bordure)"><span><b>Bénéfice estimé du mois</b></span><b class="tnum">' + euro(f.benef) + "</b></div>" +
    '<p class="k" style="margin-top:10px;font-size:12px">2 · À réserver sur ce bénéfice</p>' +
    '<div class="tvaline"><span>Cotisations sociales (~' + st2.cotis + '% du bénéfice)</span><b class="tnum">' + euro(f.cotis) + "</b></div>" +
    '<div class="tvaline"><span>Impôts (~' + st2.impot + '% du bénéfice après cotisations)</span><b class="tnum">' + euro(f.impot) + "</b></div>" +
    '<div class="tvaline"><span>TVA du trimestre en cours (solde estimé)</span><b class="tnum">' + euro(resTVA) + "</b></div>" +
    '<div class="tvaline" style="border-top:2px solid var(--bordure)"><span><b>Total suggéré</b></span><b class="tnum" style="color:#047857">' + euro(f.cotis + f.impot + resTVA) + "</b></div>" +
    '<div class="two" style="margin-top:10px"><div class="fld"><label>% cotisations (à vérifier INASTI)</label><input type="number" step="0.5" value="' + st2.cotis + '" data-cpt="cotis"></div>' +
    '<div class="fld"><label>% impôts (ton hypothèse)</label><input type="number" step="0.5" value="' + st2.impot + '" data-cpt="impot"></div></div>' +
    '<div class="fld" style="margin-top:8px"><label>% TVA appliqué à tes prestations</label><input type="number" step="1" value="' + (st2.tvaDefault || 21) + '" data-cpt="tvaDefault"></div>' +
    '<p class="note">Pourquoi c’est calculé ainsi : cotisations et impôts se paient sur le <b>bénéfice</b> (ce qui reste après TVA et frais), jamais sur tout ce que tu encaisses. Les % sont TES paramètres, pas des taux officiels — l’impôt réel est progressif et annuel. À valider avec ta caisse d’assurances sociales / un comptable.</p></section>';

  /* projection annuelle (sans compter deux fois une intervention facturée) */
  var caYtd = 0;
  var linkedY = venLinkedBkIds();
  DB.bookings.forEach(function (b) { if (b.statut === "termine" && !linkedY[b.id] && (b.date || "").slice(0, 4) === String(now.getFullYear())) caYtd += b.total || 0; });
  cptData().ven.forEach(function (v) { if (v.statut !== "annulee" && (v.date || "").slice(0, 4) === String(now.getFullYear())) caYtd += v.paye || 0; });
  var dayOfYear = Math.round((now - new Date(now.getFullYear(), 0, 1)) / 864e5) + 1;
  if (caYtd > 0 && dayOfYear > 14) {
    var proj = caYtd / dayOfYear * 365;
    h += '<section class="card sec"><p class="k">📈 Projection annuelle <span class="estbadge">estimation</span></p>' +
      '<div class="tvaline"><span>Scénario prudent (−20%)</span><b class="tnum">' + euro(proj * 0.8) + "</b></div>" +
      '<div class="tvaline"><span>Scénario central (rythme actuel)</span><b class="tnum" style="color:#047857">' + euro(proj) + "</b></div>" +
      '<div class="tvaline"><span>Scénario optimiste (+20%)</span><b class="tnum">' + euro(proj * 1.2) + "</b></div>" +
      '<p class="note">Hypothèse : extrapolation linéaire de ' + euro(caYtd) + " encaissés sur " + dayOfYear + " jours. Ne tient pas compte de la saisonnalité.</p></section>";
  }

  /* à traiter */
  var td = todayStr();
  var todo = [];
  cptData().dep.forEach(function (d) {
    if (d.statut !== "paye" && d.echeance) {
      var j = Math.round((parseDateStr(d.echeance) - parseDateStr(td)) / 864e5);
      if (j < 0) todo.push({ u: 0, html: '<div class="anomalie">⚫ Facture ' + esc(d.fournisseur || "?") + " " + euro(d.ttc || 0) + " en retard de " + (-j) + " j.</div>" });
      else if (j <= 7) todo.push({ u: 1, html: '<div class="anomalie" style="background:var(--ambre-bg);color:#78350F">🟠 ' + esc(d.fournisseur || "?") + " " + euro(d.ttc || 0) + " à payer dans " + j + " j.</div>" });
    }
  });
  cptData().ven.forEach(function (v) {
    if (v.statut !== "payee" && v.statut !== "annulee" && v.statut !== "brouillon" && v.echeance && v.echeance < td) {
      todo.push({ u: 0, html: '<div class="anomalie">🔴 Facture #' + esc(v.numero) + " (" + esc(v.client || "?") + ") impayée — échéance dépassée. Ouvre-la pour relancer.</div>" });
    }
  });
  var facPro = facturesUnpaid().filter(function (f) { var j2 = facDays(f); return j2 !== null && j2 <= 7; });
  facPro.slice(0, 2).forEach(function (f) {
    todo.push({ u: 1, html: '<div class="anomalie" style="background:var(--ambre-bg);color:#78350F">🟠 [StayClean → Factures] ' + esc(f.fournisseur || "?") + " " + euro(f.montantTTC || 0) + (f.echeance ? " avant le " + humanDate(f.echeance) : "") + "</div>" });
  });
  var avf = cptData().dep.filter(function (d) { return d.nature === "averifier"; }).length;
  if (avf) todo.push({ u: 2, html: '<div class="anomalie" style="background:#E0F2FE;color:#0C4A6E">🔵 ' + avf + " dépense" + (avf > 1 ? "s" : "") + " à catégoriser (nature pro/perso à confirmer).</div>" });
  if (todo.length) {
    h += '<section class="card tsec late"><p class="k">✅ Que dois-je faire ? <span class="cnt">' + todo.length + "</span></p>";
    todo.sort(function (a, b) { return a.u - b.u; }).slice(0, 6).forEach(function (t2, i2) {
      h += t2.html.replace('class="anomalie"', 'class="anomalie"').replace(">🔴", "><b>" + (i2 + 1) + ".</b> 🔴").replace(">🟠", "><b>" + (i2 + 1) + ".</b> 🟠").replace(">⚫", "><b>" + (i2 + 1) + ".</b> ⚫").replace(">🔵", "><b>" + (i2 + 1) + ".</b> 🔵");
    });
    h += "</section>";
  }

  /* anomalies */
  var ano = cptAnomalies();
  if (ano.length) {
    h += '<section class="card tsec"><p class="k">⚠️ Anomalies détectées</p>';
    ano.forEach(function (a) { h += '<div class="anomalie">' + a + "</div>"; });
    h += "</section>";
  }

  h += '<button class="linkline" data-act="cpt-export">⬇️ Export CSV pour mon comptable</button>';
  h += '<div class="disclaim">Cette section est un <b>assistant de pilotage</b>, pas un comptable : les montants marqués « estimation » reposent sur tes encodages et tes paramètres. Pour tes déclarations officielles, valide avec un professionnel.</div>';
  return h;
}

/* export CSV dépenses + ventes */
function cptExportCSV() {
  var L = ["TYPE;DATE;FOURNISSEUR_CLIENT;NUMERO;HTVA;TVA;TAUX;TVAC;CATEGORIE;NATURE;PCT_PRO;STATUT;NOTE"];
  cptData().dep.forEach(function (d) {
    L.push(["DEPENSE", d.date || "", (d.fournisseur || "").replace(/;/g, ","), d.numero || "", d.ht != null ? d.ht : "", d.tvaMontant != null ? d.tvaMontant : "", d.tvaTaux != null ? d.tvaTaux : "", d.ttc != null ? d.ttc : "", d.categorie, d.nature + (d.pctPro != null ? "" : ""), d.pctPro != null ? d.pctPro : "", d.statut, (d.note || "").replace(/;/g, ",")].join(";"));
  });
  cptData().ven.forEach(function (v) {
    L.push(["VENTE", v.date || "", (v.client || "").replace(/;/g, ","), v.numero || "", v.ht != null ? v.ht : "", v.tvaMontant != null ? v.tvaMontant : "", v.tvaTaux != null ? v.tvaTaux : "", v.ttc != null ? v.ttc : "", "", "", "", v.statut + " (encaissé " + (v.paye || 0) + ")", (v.note || "").replace(/;/g, ",")].join(";"));
  });
  var blob = new Blob(["﻿" + L.join("\r\n")], { type: "text/csv;charset=utf-8" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "compta-stayclean-" + todayStr() + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
  toast("ok", ["Export CSV généré — " + cptData().dep.length + " dépenses, " + cptData().ven.length + " ventes."]);
}

  var mk = todayStr().slice(0, 7);

  var ca = cptCA(mk), caAll = cptCA(null), dep = cptDepenses(mk);
  L.push("CE MOIS : encaissé " + Math.round(ca.encaisse + ca.factureEncaisse) + "€ (interventions terminées " + Math.round(ca.encaisse) + "€ + factures " + Math.round(ca.factureEncaisse) + "€) · dépenses " + Math.round(dep.total) + "€ (dont pro " + Math.round(dep.pro) + "€).");

  var byCat = {};
  cptData().dep.forEach(function (d) {
    var yk = (d.date || "").slice(0, 4);
    if (yk !== String(new Date().getFullYear())) return;
    byCat[d.categorie] = (byCat[d.categorie] || 0) + (d.ttc || 0);
  });
  var catL = Object.keys(byCat).map(function (k) { return CAT_LABEL[k] + " " + Math.round(byCat[k]) + "€"; });
  if (catL.length) L.push("DÉPENSES PAR CATÉGORIE (année) : " + catL.join(" · ") + ".");
  var deps = cptData().dep.slice(-15);
  if (deps.length) {
    L.push("DERNIÈRES DÉPENSES :");
    deps.forEach(function (d) { L.push("- " + (d.date || "?") + " · " + (d.fournisseur || "?") + " · " + (d.ttc || 0) + "€ TVAC (TVA " + (d.tvaMontant != null ? d.tvaMontant + "€" : "?") + (d.tvaTaux != null ? ", taux " + d.tvaTaux + "%" : "") + ") · " + CAT_LABEL[d.categorie] + " · nature " + d.nature + (d.statut === "paye" ? " · payée" : " · à payer" + (d.echeance ? " avant " + d.echeance : ""))); });
  }
  var vens = cptData().ven.slice(-10);
  if (vens.length) {
    L.push("FACTURES ÉMISES :");
    vens.forEach(function (v) { L.push("- #" + v.numero + " · " + (v.client || "?") + " · " + (v.ttc || 0) + "€ TVAC · " + v.statut + " · encaissé " + (v.paye || 0) + "€" + (v.echeance ? " · éch. " + v.echeance : "")); });
  }

  if (/API key|invalid|401|403|PERMISSION/i.test(m)) return "Ta clé IA semble invalide ou expirée — vérifie-la dans Réglages.";
  if (/Trop long/i.test(m)) return "La réponse met trop de temps — réessaie, souvent ça passe au 2e essai.";

/* ============ réservations depuis le site web (stayclean.be) ==========
   L'app est le cerveau : elle publie ses créneaux libres dans Supabase,
   le site les affiche, et les demandes reviennent ici pour validation.
   Rien n'est confirmé au client sans que Mohamed ait donné son accord. */

function siteCfg() { return DB.settings.site || DEFAULT_SETTINGS.site; }

/* durée occupée par un RDV (durée réelle + tampon de déplacement) */
function bkOccupe(b) { return (b.durationMin || DB.settings.defaultDuration || 120) + (siteCfg().tampon || 0); }

/* Les créneaux réellement proposables, calculés depuis SON agenda :
   jours travaillés, délai minimum, limite de RDV par jour, chevauchements. */
/* ============ jours bloqués (voyage, congé, indisponible) ============ */

function uidCg() { return "cg_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function congeAt(date) {
  return (DB.conges || []).find(function (c) { return c.du <= date && date <= c.au; }) || null;
}
function congesActifs() {
  var td = todayStr();
  return (DB.conges || []).filter(function (c) { return c.au >= td; })
    .sort(function (a, b) { return a.du < b.du ? -1 : 1; });
}
function congeCreer(du, au, motif) {
  if (!du || !au) return null;
  if (au < du) { var t = du; du = au; au = t; }
  DB.conges = DB.conges || [];
  var c = { id: uidCg(), du: du, au: au, motif: (motif || "Indisponible").trim() || "Indisponible" };
  DB.conges.push(c);
  save(); siteSync();
  return c;
}
function congeSupprimer(id) {
  DB.conges = (DB.conges || []).filter(function (c) { return c.id !== id; });
  save(); siteSync();
}
function congeLabel(c) {
  return "⛔ " + esc(c.motif) + " — " + (c.du === c.au ? humanDate(c.du) : "du " + humanDate(c.du) + " au " + humanDate(c.au));
}

/* Les JOURS ouverts à la réservation en ligne.
   Règle métier : jamais le jour même — le premier jour proposable est
   demain, calculé chaque jour depuis la date locale réelle (rien en dur). */
function siteJoursOuverts() {
  var cfg = siteCfg(), out = [];
  var debut = addDaysStr(todayStr(), Math.max(1, cfg.delaiJours || 1));
  for (var i = 0; i < (cfg.horizonJours || 30); i++) {
    var jour = addDaysStr(debut, i);
    var jsem = (parseDateStr(jour).getDay() + 6) % 7 + 1; /* 1 = lundi … 7 = dimanche */
    if (cfg.jours.indexOf(jsem) === -1) continue;
    if (congeAt(jour)) continue; /* jour bloqué (voyage, congé) : jamais proposé */
    out.push(jour);
  }
  return out;
}

/* Les PLAGES réellement libres d'une journée : on part de la journée de
   travail entière, puis on retire chaque RDV et chaque tâche datée, en
   réservant le temps de trajet avant et après. Un client pourra ensuite
   démarrer à n'importe quelle heure d'une plage, tant que sa prestation
   se termine avant la fin de cette plage. */
function siteFenetresJour(jour) {
  if (congeAt(jour)) return []; /* jour bloqué : aucune plage */
  var cfg = siteCfg();
  var ouv = toMin(cfg.ouverture || "10:00"), fer = toMin(cfg.fermeture || "19:00");
  var tampon = cfg.tampon || 0;
  var libres = [{ d: ouv, f: fer }];

  function retirer(d0, f0) {
    var res = [];
    libres.forEach(function (w) {
      if (f0 <= w.d || d0 >= w.f) { res.push(w); return; }   /* aucun chevauchement */
      if (d0 > w.d) res.push({ d: w.d, f: Math.min(d0, w.f) });
      if (f0 < w.f) res.push({ d: Math.max(f0, w.d), f: w.f });
    });
    libres = res;
  }

  if (DB.bookings.filter(function (b) { return b.date === jour && b.statut !== "annule"; }).length >= DB.settings.maxPerDay) return [];

  DB.bookings.forEach(function (b) {
    if (b.date !== jour || b.statut === "annule") return;
    var bd = toMin(b.heure);
    retirer(bd - tampon, bd + (b.durationMin || DB.settings.defaultDuration || 120) + tampon);
  });
  todosOn(jour).forEach(function (t) {
    if (!t.heure) return;
    var td = toMin(t.heure);
    retirer(td - tampon, td + (t.dur || 60) + tampon);
  });
  /* les demandes du site pas encore traitées tiennent aussi leur place */
  demNouvelles().forEach(function (d) {
    if (d.jour !== jour) return;
    var dd = toMin(d.heure);
    retirer(dd - tampon, dd + (d.duree_min || DB.settings.defaultDuration || 120) + tampon);
  });

  return libres.filter(function (w) { return w.f - w.d >= 30; })
    .map(function (w) { return { jour: jour, debut: fromMin(w.d), fin: fromMin(w.f) }; });
}

function siteFenetres() {
  var out = [];
  siteJoursOuverts().forEach(function (j) { out = out.concat(siteFenetresJour(j)); });
  return out;
}

/* Combien de temps dure chaque prestation du site, d'après TA grille de

  vc1: "voiture", vc2: "voiture",
  ch: "chaise", po: "pouf", moquette: "moquette"
};
function siteDurees() {
  var d = {};
  Object.keys(SITE_ITEMS).forEach(function (k) {
    var kw = norm(SITE_ITEMS[k]);
    var hit = DB.settings.durations.find(function (r) { return r.kw && kw.indexOf(norm(r.kw)) !== -1; });
    d[k] = hit ? hit.min : (DB.settings.defaultDuration || 120);
  });
  return d;
}

/* nombre total de minutes encore libres (pour l'affichage dans Réglages) */
function siteMinutesLibres() {
  return siteFenetres().reduce(function (s, w) { return s + (toMin(w.fin) - toMin(w.debut)); }, 0);
}

/* Publie vers Supabase les plages libres + tes réglages.
   L'app est la seule source de vérité : on remplace tout à chaque fois,
   après avoir récupéré les demandes en attente (elles gardent leur place). */
function sitePublier() {
  var c = getSb();
  if (!c || !session || !siteCfg().actif) return Promise.resolve({ fenetres: 0 });
  var cfg = siteCfg();
  var fen = siteFenetres();
  var conf = {
    id: 1,
    data: {
      ouverture: cfg.ouverture, fermeture: cfg.fermeture,
      conseilles: cfg.conseilles, pas: cfg.pas || 30, tampon: cfg.tampon || 30,
      durees: siteDurees(),
      jours: siteJoursOuverts(),
      maj: new Date().toISOString()
    },
    maj: new Date().toISOString()
  };
  return c.from("sc_fenetres").delete().gte("jour", todayStr()).then(function () {
    return fen.length ? c.from("sc_fenetres").insert(fen) : Promise.resolve({});
  }).then(function (res) {
    if (res && res.error) throw res.error;
    return c.from("sc_fenetres").delete().lt("jour", todayStr()); /* ménage du passé */
  }).then(function () {
    return c.from("sc_config").upsert(conf, { onConflict: "id" });
  }).then(function (res) {
    if (res && res.error) throw res.error;
    return { fenetres: fen.length, jours: conf.data.jours.length };
  });
}

/* Récupère les demandes non traitées et les range dans l'app */
function siteRecevoir() {
  var c = getSb();
  if (!c || !session || !siteCfg().actif) return Promise.resolve(0);
  return c.from("sc_demandes").select("*").eq("statut", "nouvelle").order("cree_le", { ascending: true }).then(function (res) {
    if (res.error) throw res.error;
    DB.dem = DB.dem || [];
    var connus = {};
    DB.dem.forEach(function (d) { connus[d.id] = true; });
    var nouveaux = (res.data || []).filter(function (d) { return !connus[d.id]; });
    nouveaux.forEach(function (d) { DB.dem.push(d); });
    if (nouveaux.length) { saveLocal(); renderChrome(); }
    return nouveaux.length;
  });
}

function demNouvelles() { return (DB.dem || []).filter(function (d) { return d.statut === "nouvelle"; }); }
function findDem(id) { return (DB.dem || []).find(function (d) { return String(d.id) === String(id); }); }

/* Transforme une demande acceptée en vraie réservation */
function demConfirmer(dem, total, note) {
  var c = getSb();
  var presta = (dem.items || []).map(function (it) { return { nom: it.label, prix: it.sub != null ? Number(it.sub) : null }; });
  var bk = {
    id: uid(),
    client: dem.nom || "Client site",
    telephone: dem.tel || null,
    adresse: dem.adresse || "",
    date: dem.jour,
    heure: dem.heure,
    creneau: toMin(dem.heure) < 12 * 60 ? "matin" : "apres-midi",
    prestations: presta,
    total: total,
    durationMin: dem.duree_min || computeDuration(presta, DB.settings),
    statut: "confirme",
    facture: !!dem.facture,
    remarques: [dem.message || "", note || "", "Réservé sur stayclean.be le " + (dem.cree_le || "").slice(0, 10)].filter(Boolean).join(" · "),
    source: "site",
    demId: dem.id,
    incomplet: [],
    creeLe: todayStr()
  };
  DB.bookings.push(bk);
  dem.statut = "confirmee";
  dem.totalFinal = total;
  save();
  if (c && session) {
    c.from("sc_demandes").update({ statut: "confirmee", traite_le: new Date().toISOString(), total: total }).eq("id", dem.id).then(function () {});
  }
  return bk;
}

/* Après TOUTE modification de RDV dans l'app (création, annulation,
   restauration, fin, suppression, déplacement), le site est remis à jour.
   Regroupe les appels rapprochés pour ne pousser qu'une fois. */
var sitePubTimer = null;
function siteSync() {
  if (!siteCfg().actif) return;
  if (sitePubTimer) clearTimeout(sitePubTimer);
  sitePubTimer = setTimeout(function () {
    sitePublier().then(function () { }).catch(function () {});
  }, 800);
}

/* Un RDV venu du site qui est annulé/supprimé doit rendre son créneau
   réservable à nouveau (sinon il resterait bloqué pour toujours). */
function siteLibererCreneau(bk) {
  if (!bk || !bk.demId) return;
  var c = getSb(); if (!c || !session) return;
  var dem = findDem(bk.demId);
  if (dem) { dem.statut = "annulee_app"; saveLocal(); }
  c.from("sc_demandes").update({ statut: "annulee", traite_le: new Date().toISOString() }).eq("id", bk.demId)
    .then(function () { siteSync(); }); /* la plage se rouvre à la republication */
}

/* Refus : le créneau redevient disponible pour quelqu'un d'autre */
function demRefuser(dem) {
  var c = getSb();
  dem.statut = "refusee";
  save();
  if (c && session) {
    c.from("sc_demandes").update({ statut: "refusee", traite_le: new Date().toISOString() }).eq("id", dem.id)
      .then(function () { siteSync(); }); /* la plage se rouvre pour quelqu'un d'autre */
  }
}

/* ------------------------ sync cloud Supabase ----------------------- */

var sb = null, pushTimer = null, session = null;

function sbConfigured() { return !!(DB.settings.sync.url && DB.settings.sync.anonKey); }
function getSb() {
  if (!sbConfigured()) return null;
  if (!sb) {
    try { sb = window.supabase.createClient(DB.settings.sync.url, DB.settings.sync.anonKey); }
    catch (e) { return null; }
  }
  return sb;
}
function setCloud(state) {
  ui.cloud = state;
  var el = document.getElementById("cloudbadge");
  if (!el) return;
  el.className = "cloud " + (state === "on" ? "on" : state === "err" ? "err" : "off");
  el.textContent = state === "on" ? "☁ Synchronisé" : state === "err" ? "⚠ Sync" : "Local";
}
function schedulePush() {
  if (!session) return;
  if (pushTimer) clearTimeout(pushTimer);
  pushTimer = setTimeout(pushCloud, 1500);
}
function pushCloud() {
  var c = getSb(); if (!c || !session) return Promise.resolve();
  return c.from("agenda_state").upsert({
    user_id: session.user.id,
    data: { bookings: DB.bookings, todos: DB.todos || [], factures: DB.factures || [], docs: DB.docs || [], cpt: DB.cpt || { dep: [], ven: [], set: null }, dem: DB.dem || [], conges: DB.conges || [], settings: sanitizedSettings(), updatedAt: DB.updatedAt },
    updated_at: new Date().toISOString()
  }).then(function (res) {
    setCloud(res.error ? "err" : "on");
  });
}
function sanitizedSettings() {
  var s = JSON.parse(JSON.stringify(DB.settings));
  return s;
}
function pullCloud() {
  var c = getSb(); if (!c || !session) return Promise.resolve();
  return c.from("agenda_state").select("data").eq("user_id", session.user.id).maybeSingle().then(function (res) {
    if (res.error) { setCloud("err"); return; }
    if (res.data && res.data.data) {
      var remote = res.data.data;
      if ((remote.updatedAt || 0) > (DB.updatedAt || 0)) {
        var localSync = DB.settings.sync;
        DB = { bookings: remote.bookings || [], todos: remote.todos || [], factures: remote.factures || [], docs: remote.docs || [], cpt: remote.cpt || { dep: [], ven: [], set: null }, dem: remote.dem || [], conges: remote.conges || [], settings: mergeSettings(remote.settings), updatedAt: remote.updatedAt || Date.now() };
        DB.settings.sync = localSync;
        saveLocal();
        renderAll();
      } else if ((DB.updatedAt || 0) > (remote.updatedAt || 0)) {
        pushCloud();
      }
      setCloud("on");
    } else {
      pushCloud();
    }
  });
}
function initSync() {
  var c = getSb();
  if (!c) { setCloud("off"); return; }
  c.auth.getSession().then(function (res) {
    session = res.data.session;
    if (session) { setCloud("on"); pullCloud().then(siteTour); }
    else setCloud("off");
    renderMain();
  });
  c.auth.onAuthStateChange(function (_e, s) {
    session = s;
    if (session) { setCloud("on"); pullCloud().then(siteTour); } else setCloud("off");
    renderMain();
  });
}

/* À chaque ouverture de l'app : on récupère les demandes du site,
   puis on republie les disponibilités à jour. Silencieux en cas d'échec :
   c'est un bonus, ça ne doit jamais bloquer l'app. */
function siteTour() {
  if (!siteCfg().actif) return Promise.resolve();
  return siteRecevoir().then(function (n) {
    if (n) toast("ok", ["📥 " + n + " nouvelle(s) demande(s) depuis ton site — onglet Demandes."]);
    return sitePublier();
  }).then(function () { renderChrome(); }).catch(function () {});
}
function doLogin() {
  var c = getSb(); if (!c) { toast("err", ["Configure d'abord l'URL et la clé Supabase dans Réglages."]); return; }
  var email = (document.getElementById("sy-email") || {}).value || "";
  var pass = (document.getElementById("sy-pass") || {}).value || "";
  if (!email || !pass) { toast("err", ["Email et mot de passe requis."]); return; }
  DB.settings.syncEmail = email;

    if (res.error) { toast("err", ["Connexion refusée : " + res.error.message]); return; }

  });

function doLogout() {
  var c = getSb(); if (!c) return;

}

/* --------------------------- statistiques ------------------------- */

function computeStats() {
  var active = DB.bookings.filter(function (b) { return b.statut !== "annule"; });
  var annules = DB.bookings.filter(function (b) { return b.statut === "annule"; });
  var ws = fmtDate(startOfWeek(new Date()));
  var we = addDaysStr(ws, 6);
  var tStr = todayStr();
  var inWeek = active.filter(function (b) { return b.date >= ws && b.date <= we; });
  var now = new Date();
  var monthKey = now.getFullYear() + "-" + pad(now.getMonth() + 1);
  var inMonth = active.filter(function (b) { return b.date.indexOf(monthKey) === 0; });
  var annulesMois = annules.filter(function (b) { return b.date.indexOf(monthKey) === 0; });
  var inToday = active.filter(function (b) { return b.date === tStr; });
  var yearKey = String(now.getFullYear());
  var inYear = active.filter(function (b) { return b.date.indexOf(yearKey) === 0; });
  var byDay = {};
  active.forEach(function (b) {
    if (b.date <= tStr) {
      if (!byDay[b.date]) byDay[b.date] = { t: 0, n: 0 };
      byDay[b.date].t += b.total || 0;
      byDay[b.date].n++;
    }
  });
  var parJour = Object.keys(byDay).sort().reverse().slice(0, 14).map(function (dk) {
    return { date: dk, total: byDay[dk].t, nb: byDay[dk].n };
  });
  function sum(a) { return a.reduce(function (s, b) { return s + (b.total || 0); }, 0); }

  var weeks = [];
  for (var i = 7; i >= 0; i--) {
    var s = fmtDate(new Date(startOfWeek(new Date()).getTime() - i * 7 * 864e5));
    var e = addDaysStr(s, 6);
    var tot = sum(active.filter(function (b) { return b.date >= s && b.date <= e; }));
    var d = parseDateStr(s);
    weeks.push({ label: d.getDate() + "/" + (d.getMonth() + 1), total: tot, current: i === 0 });
  }

  var months = [];
  for (var mi = 0; mi < 12; mi++) {
    var mk = yearKey + "-" + pad(mi + 1);
    var mtot = 0;
    active.forEach(function (b) { if (b.date.indexOf(mk) === 0) mtot += b.total || 0; });
    months.push({ label: MOIS[mi], total: mtot, current: mi === now.getMonth() });
  }

  var parPresta = {};
  active.forEach(function (b) {
    var arr = b.prestations.length ? b.prestations : [{ nom: "Autre", prix: b.total }];
    arr.forEach(function (p) {
      var n = norm(p.nom);
      var hit = DB.settings.durations.find(function (r) { return r.kw && n.indexOf(norm(r.kw)) !== -1; });
      var key = hit ? hit.label : (p.nom || "Autre");
      parPresta[key] = (parPresta[key] || 0) + (p.prix == null ? 0 : p.prix);
    });
  });
  var repartition = Object.keys(parPresta).map(function (k) { return [k, parPresta[k]]; })
    .filter(function (x) { return x[1] > 0; })
    .sort(function (a, b) { return b[1] - a[1]; }).slice(0, 6);

  return {
    caWeek: sum(inWeek), caMonth: sum(inMonth), caAnnuleMois: sum(annulesMois),
    caToday: sum(inToday), nbToday: inToday.length,
    caYear: sum(inYear), nbYear: inYear.length,
    parJour: parJour,
    months: months, year: yearKey,
    annules: annules,
    aVenirWeek: sum(inWeek.filter(function (b) { return b.date > tStr || (b.date === tStr && b.statut !== "termine"); })),
    nbWeek: inWeek.length, nbMonth: inMonth.length,
    nbAVenir: active.filter(function (b) { return b.date >= tStr; }).length,
    caActifTotal: caActif(DB.bookings),
    panier: inMonth.length ? sum(inMonth) / inMonth.length : 0,
    weeks: weeks, repartition: repartition, monthName: MOIS_FULL[now.getMonth()]
  };
}

function showWarn(msg) {
  var el = document.getElementById("warn");
  if (!msg) { el.classList.add("hidden"); el.textContent = ""; }
  else { el.classList.remove("hidden"); el.textContent = msg; }
}

var toastTimer = null;
function toast(type, lignes) {
  var box = document.getElementById("toastbox");
  var html = '<div class="toast ' + type + '">';
  lignes.forEach(function (l, i) {
    html += "<p>" + (i === 0 && type === "ok" ? "✓ " : "") + esc(l) + "</p>";
  });
  html += "</div>";
  box.innerHTML = html;
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { box.innerHTML = ""; }, lignes.length > 3 ? 12000 : 8000);
}

function thumbsHtml(list, target) {
  var h = '<div class="thumbs">';
  list.forEach(function (im, idx) {
    h += '<div class="thumb"><img src="' + im.preview + '" alt="Capture ' + (idx + 1) + '">' +
      '<button class="rm" data-act="img-rm" data-target="' + target + '" data-id="' + im.id + '">×</button><span class="n tnum">' + (idx + 1) + "</span></div>";
  });
  if (list.length < MAX_IMGS) {
    h += '<button class="addimg" data-act="img-add" data-target="' + target + '">+<small>capture</small></button>';
  }
  h += "</div>";
  return h;
}

function weekDates() {
  var start = startOfWeek(new Date());
  start.setDate(start.getDate() + ui.weekOffset * 7);
  var arr = [];
  for (var i = 0; i < 7; i++) { var d = new Date(start); d.setDate(d.getDate() + i); arr.push(fmtDate(d)); }
  return arr;
}

/* chevauchement de deux RDV le même jour */
function conflitsJour(date) {
  var bs = DB.bookings.filter(function (b) { return b.date === date && b.statut !== "annule"; })
    .sort(function (a, b) { return toMin(a.heure) - toMin(b.heure); });
  var out = [];
  for (var i = 1; i < bs.length; i++) {
    var prev = bs[i - 1];
    if (toMin(prev.heure) + (prev.durationMin || DB.settings.defaultDuration || 120) > toMin(bs[i].heure)) out.push(bs[i]);
  }
  return out;
}

/* temps libre restant d'un jour, en texte court */
function libreLabel(date) {
  if (congeAt(date)) return null;
  var w = siteFenetresJour(date);
  if (!w.length) return "";
  var min = w.reduce(function (s, x) { return s + (toMin(x.fin) - toMin(x.debut)); }, 0);
  return fmtH(min) + " libre" + (w.length > 1 ? " (" + w.length + " plages)" : "");
}

function renderPlanning() {
  var st = computeStats();

    h += '<div class="quickbar">' +

function rangeFor(period) {
  var now = new Date();
  if (period === "mois") {
    var mc = ui.revMonth || { y: now.getFullYear(), m: now.getMonth() };
    ui.revMonth = mc;
    var s = mc.y + "-" + pad(mc.m + 1) + "-01";
    var e = mc.y + "-" + pad(mc.m + 1) + "-" + pad(new Date(mc.y, mc.m + 1, 0).getDate());
    return { s: s, e: e, label: MOIS_FULL[mc.m] + " " + mc.y, current: mc.y === now.getFullYear() && mc.m === now.getMonth(), gran: "mois" };
  }
  if (period === "annee") {
    var y = ui.revYear || now.getFullYear();
    ui.revYear = y;
    return { s: y + "-01-01", e: y + "-12-31", label: "Ann\u00e9e " + y, current: y === now.getFullYear(), gran: "annee" };
  }
  var start = startOfWeek(new Date());
  start.setDate(start.getDate() + ui.revWeekOff * 7);
  var sw = fmtDate(start), ew = addDaysStr(sw, 6);
  var a = parseDateStr(sw), b2 = parseDateStr(ew);
  return { s: sw, e: ew, label: a.getDate() + " " + MOIS[a.getMonth()] + " \u2013 " + b2.getDate() + " " + MOIS[b2.getMonth()], current: ui.revWeekOff === 0, gran: "semaine" };
}

function periodStats(r) {
  var active = DB.bookings.filter(function (b) { return b.statut !== "annule" && b.date >= r.s && b.date <= r.e; });
  var annul = DB.bookings.filter(function (b) { return b.statut === "annule" && b.date >= r.s && b.date <= r.e; });
  var tStr = todayStr();
  function sum(a) { return a.reduce(function (s, b) { return s + (b.total || 0); }, 0); }
  var byDay = {};
  active.forEach(function (b) {
    if (!byDay[b.date]) byDay[b.date] = { t: 0, n: 0 };
    byDay[b.date].t += b.total || 0; byDay[b.date].n++;
  });
  var parJour = Object.keys(byDay).sort().reverse().map(function (d) {
    return { date: d, total: byDay[d].t, nb: byDay[d].n, futur: d > tStr };
  });
  var bars = [];
  if (r.gran === "semaine") {
    for (var i = 0; i < 7; i++) {
      var d = addDaysStr(r.s, i);
      bars.push({ label: JOURS[i], total: (byDay[d] || { t: 0 }).t, current: d === tStr });
    }
  } else if (r.gran === "mois") {
    var days = parseInt(r.e.slice(8), 10);
    for (var j = 1; j <= days; j++) {
      var dj = r.s.slice(0, 8) + pad(j);
      bars.push({ label: (j === 1 || j % 5 === 0) ? String(j) : "", total: (byDay[dj] || { t: 0 }).t, current: dj === tStr });
    }
  } else {
    var y = parseInt(r.s.slice(0, 4), 10);
    var nowD = new Date();
    for (var m2 = 0; m2 < 12; m2++) {
      var mk = y + "-" + pad(m2 + 1);
      var mt = 0;
      active.forEach(function (b) { if (b.date.indexOf(mk) === 0) mt += b.total || 0; });
      bars.push({ label: MOIS[m2].charAt(0).toUpperCase(), total: mt, current: y === nowD.getFullYear() && m2 === nowD.getMonth() });
    }
  }
  var parPresta = {};
  active.forEach(function (b) {
    var arr = b.prestations.length ? b.prestations : [{ nom: "Autre", prix: b.total }];
    arr.forEach(function (p) {
      var n = norm(p.nom);
      var hit = DB.settings.durations.find(function (rr) { return rr.kw && n.indexOf(norm(rr.kw)) !== -1; });
      var key = hit ? hit.label : (p.nom || "Autre");
      parPresta[key] = (parPresta[key] || 0) + (p.prix == null ? 0 : p.prix);
    });
  });
  var repartition = Object.keys(parPresta).map(function (k) { return [k, parPresta[k]]; })
    .filter(function (x) { return x[1] > 0; })
    .sort(function (a, b) { return b[1] - a[1]; }).slice(0, 6);
  var aVenir = sum(active.filter(function (b) { return b.date > tStr || (b.date === tStr && b.statut !== "termine"); }));
  return { ca: sum(active), nb: active.length, panier: active.length ? sum(active) / active.length : 0, aVenir: aVenir, bars: bars, parJour: parJour, repartition: repartition, annules: annul, caAnnule: sum(annul) };
}

/* Records de tous les temps : meilleur jour / semaine / mois */
function revRecords() {
  var byDay = {}, byWeek = {}, byMonth = {};
  DB.bookings.forEach(function (b) {
    if (b.statut === "annule" || !b.date) return;
    var t = b.total || 0;
    byDay[b.date] = (byDay[b.date] || 0) + t;
    var ws = fmtDate(startOfWeek(parseDateStr(b.date)));
    byWeek[ws] = (byWeek[ws] || 0) + t;
    var ym = b.date.slice(0, 7);
    byMonth[ym] = (byMonth[ym] || 0) + t;
  });
  function best(m) {
    var k = null;
    Object.keys(m).forEach(function (x) { if (k === null || m[x] > m[k]) k = x; });
    return k ? { k: k, v: m[k] } : null;
  }
  return { day: best(byDay), week: best(byWeek), month: best(byMonth) };
}

/* CA de la période précédant r (pour la comparaison) */
function prevPeriodCA(r, period) {
  var s, e2;
  if (period === "semaine") { s = addDaysStr(r.s, -7); e2 = addDaysStr(r.e, -7); }
  else if (period === "mois") {
    var y = +r.s.slice(0, 4), m = +r.s.slice(5, 7) - 1;
    var pm = m - 1, py = y;
    if (pm < 0) { pm = 11; py--; }
    s = py + "-" + pad(pm + 1) + "-01";
    e2 = py + "-" + pad(pm + 1) + "-" + pad(new Date(py, pm + 1, 0).getDate());
  } else {
    var y2 = +r.s.slice(0, 4) - 1;
    s = y2 + "-01-01"; e2 = y2 + "-12-31";
  }
  var ca = 0;
  DB.bookings.forEach(function (b) {
    if (b.statut !== "annule" && b.date >= s && b.date <= e2) ca += b.total || 0;
  });
  return ca;
}

  var st = computeStats();

  var r = rangeFor(period);
  var p = periodStats(r);
  var h = '<p class="sub">Aujourd\u2019hui : <b class="tnum">' + euro(st.caToday) + '</b> \u00b7 Ann\u00e9e ' + st.year + ' : <b class="tnum">' + euro(st.caYear) + "</b></p>";
  h += '<div class="seg">' +
    '<button class="' + (period === "semaine" ? "on" : "") + '" data-act="rev-period" data-v="semaine">Semaine</button>' +
    '<button class="' + (period === "mois" ? "on" : "") + '" data-act="rev-period" data-v="mois">Mois</button>' +
    '<button class="' + (period === "annee" ? "on" : "") + '" data-act="rev-period" data-v="annee">Ann\u00e9e</button>' +
    "</div>";
  h += '<div class="wknav"><button class="card arrow" data-act="rev-nav" data-d="-1">\u2039</button>' +
    '<button class="lbl" data-act="rev-nav" data-d="0">' + r.label + (!r.current ? "<span>aujourd\u2019hui</span>" : "") + "</button>" +
    '<button class="card arrow" data-act="rev-nav" data-d="1">\u203a</button></div>';
  var prevCA = prevPeriodCA(r, period);
  var deltaHtml = "";
  if (prevCA > 0) {
    var dPct = Math.round((p.ca - prevCA) / prevCA * 100);
    deltaHtml = ' \u00b7 <b style="color:' + (dPct >= 0 ? "var(--vert)" : "var(--rouge)") + '">' + (dPct >= 0 ? "+" : "") + dPct + "%</b> vs " + (period === "semaine" ? "semaine pr\u00e9c." : period === "mois" ? "mois pr\u00e9c." : "ann\u00e9e pr\u00e9c.") + " (" + euro(prevCA) + ")";
  } else if (p.ca > 0) {
    deltaHtml = ' \u00b7 <b style="color:var(--vert)">nouveau record vs p\u00e9riode pr\u00e9c. (0\u202f\u20ac)</b>';
  }
  h += '<section class="card hero"><p class="k">Chiffre d\u2019affaires</p><p class="v grad tnum">' + euro(p.ca) + '</p>' +
    '<p class="s">' + p.nb + " intervention" + (p.nb > 1 ? "s" : "") + (p.nb ? " \u00b7 panier " + euro(p.panier) : "") + (p.aVenir > 0 ? " \u00b7 dont " + euro(p.aVenir) + " \u00e0 venir" : "") + deltaHtml + "</p></section>";

  /* records de tous les temps */
  var rec = revRecords();
  if (rec.day || rec.week || rec.month) {
    h += '<section class="card sec"><p class="k">\ud83c\udfc6 Tes records</p>';
    if (rec.day) h += '<button class="dayrow" data-act="cal-day" data-d="' + rec.day.k + '"><span>Meilleur jour <small>\u00b7 ' + humanDate(rec.day.k) + '</small></span><b class="tnum">' + euro(rec.day.v) + "</b></button>";
    if (rec.week) h += '<div class="dayrow" style="cursor:default"><span>Meilleure semaine <small>\u00b7 du ' + humanDate(rec.week.k) + '</small></span><b class="tnum">' + euro(rec.week.v) + "</b></div>";
    if (rec.month) h += '<div class="dayrow" style="cursor:default"><span>Meilleur mois <small>\u00b7 ' + MOIS_FULL[+rec.month.k.slice(5, 7) - 1] + " " + rec.month.k.slice(0, 4) + '</small></span><b class="tnum">' + euro(rec.month.v) + "</b></div>";
    h += "</section>";
  }
  h += '<section class="card sec"><p class="k">' + (r.gran === "annee" ? "Par mois" : "Par jour") + '</p><div class="bars' + (r.gran === "mois" ? " tight" : "") + '">';
  var max = Math.max.apply(null, p.bars.map(function (w) { return w.total; }).concat([1]));
  p.bars.forEach(function (w) {
    var pct = Math.max((w.total / max) * 100, w.total > 0 ? 8 : 3);
    h += '<div class="bar' + (w.current ? " cur" : "") + '"><i style="height:' + pct + '%"></i><span class="tnum">' + w.label + "</span></div>";
  });
  h += "</div></section>";

  /* vue année : liste des mois cliquables */
  if (r.gran === "annee") {
    h += '<section class="card sec"><p class="k">Choisis un mois</p>';
    var ySel = ui.revYear || new Date().getFullYear();
    for (var mi = 0; mi < 12; mi++) {
      var mkey = ySel + "-" + pad(mi + 1);
      var mtot = 0, mnb = 0;
      DB.bookings.forEach(function (b) {
        if (b.statut !== "annule" && b.date.indexOf(mkey) === 0) { mtot += b.total || 0; mnb++; }
      });
      h += '<button class="dayrow" data-act="rev-month" data-m="' + mi + '"><span>' + MOIS_FULL[mi] + (mnb ? ' <small>\u00b7 ' + mnb + ' interv.</small>' : "") + '</span><b class="tnum"' + (mtot === 0 ? ' style="color:#9FB6C8;font-weight:500"' : "") + '>' + euro(mtot) + " \u203a</b></button>";
    }
    h += '<p class="note" style="margin-top:8px">Touche un mois pour voir son d\u00e9tail.</p></section>';
  }

  if (p.parJour.length) {
    h += '<section class="card sec"><p class="k">D\u00e9tail par jour</p>';
    p.parJour.forEach(function (dj) {
      h += '<button class="dayrow" data-act="cal-day" data-d="' + dj.date + '">' +
        '<span>' + humanDate(dj.date) + ' <small>\u00b7 ' + dj.nb + ' interv.' + (dj.futur ? " \u00b7 \u00e0 venir" : "") + '</small></span>' +
        '<b class="tnum">' + euro(dj.total) + "</b></button>";
    });
    h += '<p class="note" style="margin-top:8px">Touche une ligne pour ouvrir le d\u00e9tail du jour.</p></section>';
  }
  if (p.repartition.length) {
    h += '<section class="card sec"><p class="k">Par prestation</p>';
    var m0 = p.repartition[0][1];
    p.repartition.forEach(function (rr) {
      h += '<div class="rep"><div class="l"><span>' + esc(rr[0]) + '</span><b class="tnum">' + euro(rr[1]) + '</b></div><div class="g"><i style="width:' + (rr[1] / m0 * 100) + '%"></i></div></div>';
    });
    h += "</section>";
  }
  h += '<section class="card sec"><div style="display:flex;justify-content:space-between;align-items:center"><p class="k" style="margin:0">Annulations \u00b7 p\u00e9riode</p><span class="tnum" style="font-size:12px;font-weight:700;color:var(--rouge)">\u2212' + euro(p.caAnnule) + "</span></div>";
  if (!p.annules.length) {
    h += '<p class="note" style="margin-top:8px">Aucune annulation sur cette p\u00e9riode.</p>';
  } else {
    p.annules.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; }).forEach(function (x) {
      h += '<div class="annrow"><div class="inf"><p>' + esc(x.client) + "</p><small>" + humanDate(x.date) + " \u00b7 " + esc(x.prestations.map(function (pp) { return pp.nom; }).join(" + ") || "\u2014") + "</small></div>" +
        '<span class="m tnum">\u2212' + euro(x.total) + "</span>" +
        '<button class="rest" data-act="restore" data-id="' + x.id + '">Restaurer</button>' +
        '<button class="del" data-act="hard-delete" data-id="' + x.id + '" aria-label="Supprimer d\u00e9finitivement">\u00d7</button></div>';
    });
  }
  h += "</section>";
  return h;
}

function renderMain() {
  var main = document.getElementById("main");
  var s = ui.space;
  if (s === "portal") { main.innerHTML = renderPortal(); return; }
  if (s === "jour") { main.innerHTML = renderJournee(); return; }
  if (s === "cpt") {
    if (ui.tab === "depenses") main.innerHTML = renderDepenses();
    else if (ui.tab === "ventes") main.innerHTML = renderVentes();
    else if (ui.tab === "tva") main.innerHTML = renderTVA();
    else main.innerHTML = renderSituation();
    return;
  }
  if (s === "perso") {
    if (ui.tab === "agenda") main.innerHTML = renderPlanning();
    else if (ui.tab === "taches") main.innerHTML = renderTaches();
    else if (ui.tab === "docs") main.innerHTML = renderDocs();
    else main.innerHTML = renderToday("perso");
    return;
  }
  /* espace pro */
  if (ui.tab === "planning") main.innerHTML = renderPlanning();
  else if (ui.tab === "demandes") main.innerHTML = renderDemandes();
  else if (ui.tab === "devis") main.innerHTML = renderDevisTab();
  else if (ui.tab === "factures") main.innerHTML = renderFactures();
  else if (ui.tab === "revenus") main.innerHTML = renderRevenus();
  else if (ui.tab === "reglages") main.innerHTML = renderReglages();
  else main.innerHTML = renderToday("pro");
}

/* Ouvre WhatsApp intelligemment : conversation directe si numéro connu,
   sinon l'app WhatsApp sur mobile, ou WhatsApp Web sur ordinateur. */
function openWhatsApp(tel) {
  var mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  if (tel) { window.open("https://wa.me/" + tel, "_blank"); return; }
  if (mobile) { window.location.href = "whatsapp://"; return; }
  window.open("https://web.whatsapp.com/", "_blank");
}

function copyText(txt) {
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(txt).catch(function () { return fallbackCopy(txt); });
  return Promise.resolve(fallbackCopy(txt));
}
function fallbackCopy(txt) {
  var ta = document.createElement("textarea");
  ta.value = txt; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); } catch (e) {}
  ta.remove();
}
function syncQText() {
  var el = document.getElementById("q-text");
  if (el && ui.qDraft) ui.qDraft._text = el.value;
}

/* Synchronise l'ajout rapide : texte tapé → parse → champs (sans écraser
   les choix manuels de l'utilisateur). */
function syncQa() {
  var qa = ui.qa; if (!qa) return;
  var tEl = document.getElementById("qa-text");
  var txt = tEl ? tEl.value : qa.titre;
  var parsed = parseQuickText(txt);
  qa.titre = parsed.titre || txt;
  if (!qa._dateMan && parsed.date) qa.date = parsed.date;
  if (!qa._heureMan && parsed.heure) qa.heure = parsed.heure;
  if (!qa._typeMan && parsed.type) qa.type = parsed.type;
  if (!qa._domMan && parsed.dom) qa.dom = parsed.dom;
}

/* Reflète l'état qa dans la modale sans re-render (le focus reste dans le champ) */
function refreshQaUI() {
  var qa = ui.qa; if (!qa) return;
  var dEl = document.getElementById("qa-date"), hEl = document.getElementById("qa-heure");
  if (dEl && !qa._dateMan) dEl.value = qa.date || "";
  if (hEl && !qa._heureMan) hEl.value = qa.heure || "";
  document.querySelectorAll('[data-act="qa-type"]').forEach(function (b) {
    b.classList.toggle("on", b.getAttribute("data-v") === qa.type);
  });
  document.querySelectorAll('[data-act="qa-dom"]').forEach(function (b) {
    b.classList.toggle("onp", qa.dom === "pro" && b.getAttribute("data-v") === "pro");
    b.classList.toggle("onx", qa.dom === "perso" && b.getAttribute("data-v") === "perso");
  });
}

document.addEventListener("change", function (e) {
  var t = e.target;

  if (t.id === "filepick") { addFiles(t.files, fileTarget); t.value = ""; return; }

  if (t.id === "docpick") {
    var fdd = t.files; 
    if (fdd && fdd.length) handleDocScan(fdd);
    t.value = "";
    return;
  }

  if (t.id === "deppick") {
    var fdp = t.files;
    if (fdp && fdp.length) handleDepScan(fdp);
    t.value = "";
    return;
  }

  if (t.id === "facpick") {
    var ff = t.files;
    if (ff && ff.length) handleFacScan(ff);
    t.value = "";
    return;
  }

  if (t.id === "importfile") {
    var f = t.files && t.files[0]; t.value = "";
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var d = JSON.parse(String(reader.result));
        if (!d || !Array.isArray(d.bookings)) throw new Error("bad");
        if (!confirm("Remplacer toutes les données actuelles par cette sauvegarde ?")) return;
        var keepSync = DB.settings.sync;
        DB = { bookings: d.bookings, todos: d.todos || [], factures: d.factures || [], docs: d.docs || [], cpt: d.cpt || { dep: [], ven: [], set: null }, dem: d.dem || [], conges: d.conges || [], settings: mergeSettings(d.settings), updatedAt: Date.now() };
        DB.settings.sync = keepSync;
        save(); renderAll();
        toast("ok", ["Sauvegarde importée — " + DB.bookings.length + " RDV chargés."]);
      } catch (err) {
        toast("err", ["Fichier de sauvegarde invalide."]);
      }
    };
    reader.readAsText(f);
    return;
  }

  var setKey = t.getAttribute("data-set");
  if (setKey) {
    var v = t.value;
    if (setKey === "maxPerDay") { DB.settings.maxPerDay = Math.max(1, Math.min(10, Number(v) || 1)); }
    else if (setKey === "defaultDuration") { DB.settings.defaultDuration = Number(v) || 120; }
    else if (setKey === "setupCode") {
      try {
        var conf = JSON.parse(atob(v.replace(/\s/g, "")));
        if (conf.u && conf.k) {
          DB.settings.sync.url = conf.u;
          DB.settings.sync.anonKey = conf.k;
          if (conf.e) DB.settings.syncEmail = conf.e;
          sb = null;
          saveLocal();
          toast("ok", ["Configuration chargée.", "Entre ton mot de passe et connecte-toi."]);
          if (sbConfigured()) initSync();
        } else {
          toast("err", ["Code incomplet — recopie-le en entier."]);
        }
      } catch (err2) {
        toast("err", ["Code invalide — recopie-le en entier avec le bouton Copier."]);
      }
      renderMain();
      return;
    }
    else if (setKey === "syncUrl") { DB.settings.sync.url = v.trim(); sb = null; }
    else if (setKey === "syncKey") { DB.settings.sync.anonKey = v.trim(); sb = null; }
    else if (setKey === "pxDiscount") { P().discount = Number(v) || 0; }
    else if (setKey === "pxMin") { P().minimum = Number(v) || 0; }
    else { DB.settings[setKey] = v; }
    save();
    if (["apiKey", "geminiKey", "provider", "syncUrl", "syncKey", "pxDiscount", "pxMin"].indexOf(setKey) !== -1) {
      if (setKey === "syncUrl" || setKey === "syncKey") { if (sbConfigured()) initSync(); }
      renderMain();
    }
    return;
  }

  var pxIdx = t.getAttribute("data-px");
  if (pxIdx != null) {
    var itp = P().items[+pxIdx];
    if (itp) { itp[t.getAttribute("data-f")] = Number(t.value) || 0; save(); if (ui.tab === "devis") renderMain(); }
    return;
  }
  var moqIdx = t.getAttribute("data-moq");
  if (moqIdx != null) {
    var pal = P().moquette[+moqIdx];
    if (pal) { pal.prix = Number(t.value) || 0; save(); }
    return;
  }

  var qArt = t.getAttribute("data-qart");
  if (qArt != null && ui.qDraft) {
    var art2 = ui.qDraft.articles[+qArt];
    if (art2) {
      var f = t.getAttribute("data-f");
      if (f === "item") { art2.item = t.value; art2.incertain = false; if (t.value === "moquette" && !art2.surface_m2) art2.surface_m2 = 10; }
      else if (f === "m2") { art2.surface_m2 = Math.max(1, Number(t.value) || 1); }
      syncQText(); renderMain();
    }
    return;
  }

  var qPrix = t.getAttribute("data-qprix");
  if (qPrix != null && ui.qDraft) {
    var pv = t.value === "" ? null : Math.max(0, Number(t.value) || 0);
    if (qPrix === "base") ui.qDraft.prixBase = pv;
    else if (qPrix === "prem") ui.qDraft.prixPremium = pv;
    renderMain();
    return;
  }

  if (t.getAttribute("data-qdur") != null && ui.qDraft) {
    var dv = t.value.trim();
    var autoLbl = quoteDurationLabel(quoteResolvedTotals(ui.qDraft));
    ui.qDraft.dureeCustom = (dv === "" || dv === autoLbl) ? null : dv;
    renderMain();
    return;
  }

  if (t.id === "q-tel" && ui.qDraft) {
    ui.qDraft.telephone = t.value.trim() || null;
    renderMain();
    return;
  }

  var durIdx = t.getAttribute("data-dur");
  if (durIdx != null) {
    var f2 = t.getAttribute("data-f");
    var row = DB.settings.durations[+durIdx];
    if (row) { row[f2] = f2 === "min" ? (Number(t.value) || 60) : t.value; save(); }
    return;
  }

  if (t.id === "qa-date" && ui.qa) { ui.qa.date = t.value || null; ui.qa._dateMan = true; return; }
  if (t.id === "qa-heure" && ui.qa) { ui.qa.heure = t.value || null; ui.qa._heureMan = true; return; }

  var depF = t.getAttribute("data-dep");
  if (depF) {
    var depT = ui.depDraft || (ui.depId ? findDep(ui.depId) : null);
    if (depT) {
      if (depF === "ttc" || depF === "tvaMontant" || depF === "ht") depT[depF] = t.value === "" ? null : Number(t.value) || 0;
      else if (depF === "tvaTaux") depT.tvaTaux = t.value === "" ? null : Number(t.value) || 0;
      else if (depF === "pctPro") depT.pctPro = t.value === "" ? null : Math.max(0, Math.min(100, Number(t.value) || 0));
      else if (depF === "echeance" || depF === "date") depT[depF] = t.value || null;
      else if (depF === "recurrent") depT.recurrent = t.checked;
      else depT[depF] = t.value;
      if (!ui.depDraft) { save(); renderMain(); }
    }
    return;
  }

  var venF = t.getAttribute("data-ven");
  if (venF) {
    var venT = ui.venDraft || (ui.venId ? findVen(ui.venId) : null);
    if (venT) {
      if (venF === "ht") {
        venT.ht = t.value === "" ? null : Number(t.value) || 0;
        if (venT.ht != null && venT.tvaTaux != null) {
          venT.tvaMontant = Math.round(venT.ht * venT.tvaTaux) / 100;
          venT.ttc = Math.round((venT.ht + venT.tvaMontant) * 100) / 100;
          renderModals();
        }
      }
      else if (venF === "tvaTaux") {
        venT.tvaTaux = t.value === "" ? null : Number(t.value) || 0;
        if (venT.ht != null && venT.tvaTaux != null) {
          venT.tvaMontant = Math.round(venT.ht * venT.tvaTaux) / 100;
          venT.ttc = Math.round((venT.ht + venT.tvaMontant) * 100) / 100;
          renderModals();
        }
      }
      else if (venF === "tvaMontant" || venF === "ttc" || venF === "paye") {
        venT[venF] = t.value === "" ? (venF === "paye" ? 0 : null) : Number(t.value) || 0;
        if (venF === "paye" && venT.paye >= (venT.ttc || 0) && venT.ttc) venT.statut = "payee";
        else if (venF === "paye" && venT.paye > 0) venT.statut = "partiel";
      }
      else if (venF === "date" || venF === "echeance") venT[venF] = t.value || null;
      else venT[venF] = t.value;
      if (!ui.venDraft) { save(); renderMain(); }
    }
    return;
  }

  var cptF = t.getAttribute("data-cpt");
  if (cptF) {
    if (cptF === "solde") {
      cptData().set.solde = t.value === "" ? null : Number(t.value) || 0;
      cptData().set.soldeDate = todayStr();
    } else {
      cptData().set[cptF] = Number(t.value) || 0;
    }
    save(); renderMain();
    return;
  }

  var demF = t.getAttribute("data-dem");
  if (demF && ui.demForm) {
    if (demF === "note") ui.demForm.note = t.value;
    else ui.demForm[demF] = t.value === "" ? 0 : Number(t.value) || 0;
    if (demF !== "note") renderModals();
    return;
  }

  var siteF = t.getAttribute("data-site");
  if (siteF) {
    var S2 = DB.settings.site;
    if (siteF === "conseilles") {
      var hs = t.value.split(/[,;\s]+/).map(function (x) { return x.trim(); })
        .filter(function (x) { return /^\d{1,2}:\d{2}$/.test(x); })
        .map(function (x) { return pad(+x.split(":")[0]) + ":" + x.split(":")[1]; });
      S2.conseilles = hs.length ? hs.sort() : DEFAULT_SETTINGS.site.conseilles.slice();
    } else if (siteF === "ouverture" || siteF === "fermeture") {
      if (/^\d{2}:\d{2}$/.test(t.value)) S2[siteF] = t.value;
    } else S2[siteF] = Math.max(0, Number(t.value) || 0);
    save(); renderMain();
    return;
  }

  var evK = t.getAttribute("data-docev");
  if (evK) { ui.docEvSel = ui.docEvSel || {}; ui.docEvSel[evK] = !!t.checked; return; }

  var ddF = t.getAttribute("data-docd");
  if (ddF && ui.docDraft) {
    if (ddF === "montant") ui.docDraft.montant = t.value === "" ? null : Number(t.value) || 0;
    else if (ddF === "echeance") { ui.docDraft.echeance = t.value || null; ui.docDraft.estimee = false; }
    else if (ddF === "expire") ui.docDraft.expire = t.value || null;
    else ui.docDraft[ddF] = t.value;
    /* la liste des entrées d'agenda proposées suit les dates saisies */
    if (ddF === "echeance" || ddF === "expire") renderModals();
    return;
  }

  var docF = t.getAttribute("data-doc");
  if (docF && ui.docId) {
    var docO = findDoc(ui.docId);
    if (docO) {
      if (docF === "montant") docO.montant = t.value === "" ? null : Number(t.value) || 0;
      else if (docF === "echeance") { docO.echeance = t.value || null; docO.estimee = false; }
      else if (docF === "expire") docO.expire = t.value || null;
      else docO[docF] = t.value;
      /* si une date change, les entrées d'agenda déjà créées suivent */
      if ((docF === "echeance" || docF === "expire") && docLinkedTodos(docO.id).length) docSyncEvents(docO, null);
      save(); renderMain(); renderModals();
    }
    return;
  }

  var fdF = t.getAttribute("data-facd");
  if (fdF && ui.facDraft) {
    if (fdF === "montantTTC") ui.facDraft.montantTTC = t.value === "" ? null : Number(t.value) || 0;
    else if (fdF === "echeance") { ui.facDraft.echeance = t.value || null; ui.facDraft.echeanceEstimee = false; }
    else if (fdF === "dateFacture") ui.facDraft.dateFacture = t.value || null;
    else ui.facDraft[fdF] = t.value;
    return;
  }

  var facF = t.getAttribute("data-fac");
  if (facF && ui.facId) {
    var facO = findFac(ui.facId);
    if (facO) {
      if (facF === "montantTTC") facO.montantTTC = t.value === "" ? null : Number(t.value) || 0;
      else if (facF === "echeance") { facO.echeance = t.value || null; facO.echeanceEstimee = false; }
      else facO[facF] = t.value;
      save(); renderMain();
    }
    return;
  }

  var tdField = t.getAttribute("data-td");
  if (tdField && ui.todoId) {
    var tdo2 = findTd(ui.todoId);
    if (tdo2) {
      tdo2[tdField] = t.value || (tdField === "titre" ? tdo2.titre : null);
      save(); renderMain();
    }
    return;
  }

  var bkField = t.getAttribute("data-bk");
  if (bkField && ui.detailId) {
    var bk = findBk(ui.detailId);
    if (bk) {
      bk[bkField] = bkField === "total" ? (Number(t.value) || 0) : t.value;
      refreshIncomplet(bk);
      save();
      if (bkField === "date" || bkField === "heure") siteSync(); /* déplacement → dispo du site à jour */
      renderMain();
    }
  }
});

document.addEventListener("paste", function (e) {
  var target = ui.showDevis ? "resa" : (ui.detailId ? "detail" : (ui.tab === "devis" ? "quote" : null));
  if (!target) return;
  var items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  var files = [];
  for (var i = 0; i < items.length; i++) {
    if (items[i].type && items[i].type.indexOf("image/") === 0) {
      var f = items[i].getAsFile();
      if (f) files.push(f);
    }
  }
  if (files.length) { addFiles(files, target); e.preventDefault(); }
});

document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "visible" && session) pullCloud();
});

/* --------------------------- démarrage ----------------------------- */

(function () {
  try {
    var hh = location.hash;
    if (hh && hh.indexOf("#setup=") === 0) {
      var conf = JSON.parse(atob(decodeURIComponent(hh.slice(7)).replace(/\s/g, "")));
      if (conf.u && conf.k) {
        DB.settings.sync.url = conf.u;
        DB.settings.sync.anonKey = conf.k;
        if (conf.e) DB.settings.syncEmail = conf.e;
        saveLocal();
        ui.tab = "reglages";
      }
      history.replaceState(null, "", location.pathname + location.search);
    }
  } catch (e) {}
})();

renderAll();
if (sbConfigured()) initSync(); else setCloud("off");
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(function () {});
}
</script>
</body>
</html>
